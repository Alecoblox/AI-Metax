<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Metax — Aprende a tu ritmo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Sora:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F4FB; --bg2:#E6EAF7; --surface:#FFFFFF; --surface2:#F7F8FD; --line:#D0D8EF;
  --text:#121833; --muted:#4A557F;
  --primary:#4B3FD6; --on-primary:#FFFFFF; --primary-soft:#E7E4FF;
  --amber:#8A5600; --amber-soft:#FFEBC2;
  --ok:#0A7650; --ok-soft:#D5F5E7; --bad:#B02E1C; --bad-soft:#FFE1DC;
  --grid:rgba(75,63,214,.11); --shadow:0 1px 0 rgba(18,24,51,.04),0 14px 30px -20px rgba(18,24,51,.4);
  --focus:#4B3FD6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F23; --bg2:#10183A; --surface:#141C3D; --surface2:#1A244C; --line:#2A3664;
    --text:#EEF2FF; --muted:#A8B3DA;
    --primary:#9A91FF; --on-primary:#0A0F23; --primary-soft:#262D66;
    --amber:#FFC15A; --amber-soft:#3A2D10;
    --ok:#4FE3A8; --ok-soft:#0F3A2E; --bad:#FF8F80; --bad-soft:#46211D;
    --grid:rgba(154,145,255,.11); --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 30px -20px rgba(0,0,0,.8);
    --focus:#9A91FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F23; --bg2:#10183A; --surface:#141C3D; --surface2:#1A244C; --line:#2A3664;
  --text:#EEF2FF; --muted:#A8B3DA;
  --primary:#9A91FF; --on-primary:#0A0F23; --primary-soft:#262D66;
  --amber:#FFC15A; --amber-soft:#3A2D10;
  --ok:#4FE3A8; --ok-soft:#0F3A2E; --bad:#FF8F80; --bad-soft:#46211D;
  --grid:rgba(154,145,255,.11); --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 30px -20px rgba(0,0,0,.8);
  --focus:#9A91FF;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
[hidden]{display:none!important}
body{
  margin:0;min-height:100%;background-color:var(--bg);color:var(--text);
  font:400 1rem/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-image:radial-gradient(var(--grid) 1.1px,transparent 1.4px);background-size:26px 26px;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:Sora,"Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.2;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.55rem,4.2vw,2.1rem);font-weight:800}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1:focus,#main:focus,.fbh:focus,.qprompt:focus{outline:none}
.skip{position:absolute;left:-999px;top:0;background:var(--primary);color:var(--on-primary);padding:.6rem 1rem;z-index:100;border-radius:0 0 10px 0}
.skip:focus{left:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.col{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .sp{flex:1}
.logo{display:inline-flex;align-items:center;gap:.5rem;font:800 1.15rem Sora,sans-serif;color:var(--text);text-decoration:none}
.logo svg{width:28px;height:28px;color:var(--primary)}
.iconbtn{display:inline-flex;align-items:center;gap:.4rem;min-height:44px;min-width:44px;padding:0 .8rem;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);text-decoration:none;font-weight:700;font-size:.92rem;position:relative;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.iconbtn .cnt{background:var(--amber-soft);color:var(--amber);border-radius:99px;padding:0 .45rem;font-size:.8rem;min-width:1.4rem;text-align:center}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);font:800 1rem Sora,sans-serif;text-decoration:none}
main{padding:1.2rem 1rem 7rem;max-width:960px;margin:0 auto;width:100%}
.ph{margin-bottom:1.3rem}
.ph p{color:var(--muted);margin-top:.35rem}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:.35rem .4rem calc(.35rem + env(safe-area-inset-bottom,0px))}
.bottom a{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.45rem .2rem;min-height:56px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:.78rem;font-weight:700}
.bottom a svg{width:24px;height:24px}
.bottom a[aria-current="page"]{color:var(--primary);background:var(--primary-soft)}
@media (min-width:900px){
  .shell{grid-template-columns:250px 1fr}
  .side{display:flex;flex-direction:column;gap:1.4rem;padding:1.4rem 1rem;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;border-right:1px solid var(--line);min-height:100%}
  .side nav{display:flex;flex-direction:column;gap:.25rem}
  .side nav a{display:flex;align-items:center;gap:.7rem;padding:.7rem .8rem;border-radius:12px;color:var(--text);text-decoration:none;font-weight:700;min-height:46px}
  .side nav a svg{width:22px;height:22px;color:var(--muted)}
  .side nav a[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
  .side nav a[aria-current="page"] svg{color:var(--primary)}
  .side nav a:hover{background:var(--surface2)}
  .bottom{display:none}
  .top .logo{display:none}
  main{padding:1.8rem 2rem 3rem}
}
@media (min-width:600px) and (max-width:899px){ main{padding:1.5rem 1.6rem 7rem} }

/* basics */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:46px;padding:.65rem 1.15rem;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:700 1rem "Atkinson Hyperlegible",system-ui,sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.lg{min-height:54px;padding:.8rem 1.6rem;font-size:1.08rem;border-radius:14px}
.btn.sm{min-height:40px;padding:.4rem .85rem;font-size:.92rem;border-radius:10px}
.btn.quiet{border-color:transparent;background:transparent;color:var(--primary)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.1rem 1.2rem;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:1rem}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.grid2{display:grid;gap:1rem;grid-template-columns:1fr}
.grid3{display:grid;gap:.8rem;grid-template-columns:1fr}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}}
.section{margin-top:1.8rem}
.section>h2{margin-bottom:.8rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .7rem;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:.88rem;font-weight:700;color:var(--muted)}
.chip.btnlike{cursor:pointer;min-height:40px;font:700 .95rem "Atkinson Hyperlegible",sans-serif;color:var(--text)}
.chip.on,.chip[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.badge{display:inline-block;padding:.05rem .55rem;border-radius:8px;font-size:.8rem;font-weight:700;background:var(--amber-soft);color:var(--amber)}
.bar{height:10px;border-radius:6px;background:var(--bg2);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block;background:var(--primary);border-radius:6px}
.bar i.p{opacity:.4}
.sti{flex:none}
.st-nuevo{color:var(--muted)}.st-practica{color:var(--amber)}.st-practicado{color:var(--primary)}.st-dominado{color:var(--ok)}
.banner{border-radius:12px;padding:.7rem 1rem;margin-bottom:1rem;font-weight:700;border:1px solid var(--line);background:var(--amber-soft);color:var(--amber)}
.hue{--h:255;background:hsl(var(--h) 70% 52% / .17);display:grid;place-items:center;border-radius:14px;width:52px;height:52px;font-size:1.6rem;flex:none}
.link{background:none;border:0;color:var(--primary);font:700 1rem "Atkinson Hyperlegible",sans-serif;text-decoration:underline;cursor:pointer;padding:.5rem;min-height:44px}

/* home */
.hero{background:var(--primary-soft);border-color:var(--primary);display:flex;flex-direction:column;gap:.9rem}
.hero h2{font-size:clamp(1.3rem,3.4vw,1.7rem)}
.hero .why{color:var(--muted)}
.mode{display:flex;flex-direction:column;gap:.35rem;text-align:left;width:100%;cursor:pointer;color:var(--text);font:inherit;text-decoration:none;padding:1rem 1.1rem}
.mode strong{font:700 1.05rem Sora,sans-serif}
.mode span{color:var(--muted);font-size:.93rem}
.mode:hover{border-color:var(--primary)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg label{position:relative;display:block}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;padding:.55rem 1rem;min-height:44px;font-weight:700;display:flex;align-items:center}
.seg input:checked+span{background:var(--primary);color:var(--on-primary)}
.seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:-3px}
.route{list-style:none;margin:0;padding:0}
.route li{position:relative;padding:.2rem 0 .2rem 3.2rem;min-height:68px}
.route li::before{content:"";position:absolute;left:1.1rem;top:0;bottom:0;border-left:2px dashed var(--line)}
.route li:first-child::before{top:1.5rem}
.route li:last-child::before{bottom:calc(100% - 1.5rem)}
.route li:only-child::before{display:none}
.route .node{position:absolute;left:.1rem;top:.55rem;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.route a{display:flex;flex-direction:column;gap:.1rem;padding:.55rem .9rem;border-radius:14px;text-decoration:none;color:var(--text);border:1px solid transparent}
.route a:hover{background:var(--surface);border-color:var(--line)}
.route .cur a{background:var(--surface);border-color:var(--primary)}
.route .sub{color:var(--muted);font-size:.9rem}
.subjrow{display:flex;align-items:center;gap:.9rem;padding:.8rem 0;border-top:1px solid var(--line)}
.subjrow:first-child{border-top:0}
.subjrow .grow{flex:1;min-width:0}
.subjrow .grow .bar{margin:.4rem 0 .25rem}
.trow{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--text);min-height:60px}
.trow:hover{border-color:var(--primary)}
.trow .tmain{flex:1;min-width:0;display:flex;flex-direction:column}
.trow .sub{color:var(--muted);font-size:.9rem}
.trow .stl{font-size:.88rem;font-weight:700;color:var(--muted)}
.scard{display:flex;gap:1rem;align-items:center;text-decoration:none;color:var(--text)}
.scard:hover{border-color:var(--primary)}
.scard .grow{flex:1;min-width:0}
.scard .bar{margin:.4rem 0 .2rem}
.unit{margin-top:1.4rem}
.unit>h3{margin-bottom:.6rem;color:var(--muted);font-family:"Atkinson Hyperlegible",sans-serif}
.tiles{display:grid;gap:.7rem;grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.8rem 1rem}
.tile b{display:block;font:800 1.6rem Sora,sans-serif}
.tile span{color:var(--muted);font-size:.9rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:.5rem;align-items:end;height:150px}
.week .d{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:.25rem;font-size:.82rem;color:var(--muted)}
.week .col2{width:100%;max-width:38px;background:var(--primary);border-radius:8px 8px 3px 3px;min-height:4px}
.week .d.today b{color:var(--primary)}
dl.meta{display:grid;grid-template-columns:auto 1fr;gap:.45rem 1.1rem;margin:0}
dl.meta dt{color:var(--muted)}dl.meta dd{margin:0;font-weight:700}

/* onboarding */
.ob{min-height:100%;display:flex;align-items:center;justify-content:center;padding:1.2rem}
.obc{width:100%;max-width:520px;display:flex;flex-direction:column;gap:1.2rem}
.opts{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:.6rem}
.optc{position:relative;display:block}
.optc input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.optc .box{display:flex;align-items:center;gap:.8rem;padding:.9rem 1rem;min-height:58px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-weight:700}
.optc .box small{display:block;font-weight:400;color:var(--muted)}
.optc .k{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.85rem;color:var(--muted)}
.optc input:checked+.box{border-color:var(--primary);background:var(--primary-soft)}
.optc input:checked+.box .k{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.optc input:focus-visible+.box{outline:3px solid var(--focus);outline-offset:2px}
.optc.good input:checked+.box{border-color:var(--ok);background:var(--ok-soft)}
.constel{width:100%;height:auto;max-height:240px}
.constel .path{fill:none;stroke:var(--primary);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:640;stroke-dashoffset:0}
.constel .nd{fill:var(--bg);stroke:var(--primary);stroke-width:2.5}
.constel text{fill:var(--muted);font:700 11px "Atkinson Hyperlegible",sans-serif}
.constel .star{fill:var(--amber)}
:root:not([data-motion="reduced"]) .constel .path{animation:draw 2.4s ease-out both}
:root:not([data-motion="reduced"]) .constel .nd,:root:not([data-motion="reduced"]) .constel text,:root:not([data-motion="reduced"]) .constel .star{animation:pop .5s ease-out both}
.constel .n1{animation-delay:.5s!important}.constel .n2{animation-delay:1.1s!important}.constel .n3{animation-delay:1.7s!important}.constel .n4{animation-delay:2.3s!important}
@keyframes draw{from{stroke-dashoffset:640}to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root[data-motion="reduced"] *{animation:none!important;transition:none!important}

/* session */
.sess{max-width:720px;margin:0 auto;padding:1rem 1rem 3rem;display:flex;flex-direction:column;gap:1rem}
.sh{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.sh .grow{flex:1;min-width:0}
.ftimer{font:800 1.1rem Sora,sans-serif;font-variant-numeric:tabular-nums}
.qprompt{font:700 1.2rem/1.4 Sora,sans-serif}
.panel{border-radius:16px;padding:1rem 1.1rem;border:1px solid var(--line);background:var(--surface)}
.panel h3{font-family:"Atkinson Hyperlegible",sans-serif;color:var(--muted);font-size:.95rem;margin-bottom:.3rem}
.panel.ex{background:var(--surface2)}
.opts .box{font-weight:400}
.inp{width:100%;min-height:52px;padding:.7rem 1rem;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:700 1.2rem "Atkinson Hyperlegible",sans-serif}
.inp:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
label.lbl{display:block;font-weight:700;margin-bottom:.35rem}
.fb{border-radius:16px;padding:1rem 1.1rem;border:1.5px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb .fbh{display:flex;align-items:center;gap:.5rem;font:800 1.2rem Sora,sans-serif}
.fb.ok .fbh{color:var(--ok)}.fb.bad .fbh{color:var(--bad)}
.fb .fbh svg{width:26px;height:26px}
.actions{display:flex;flex-direction:column;gap:.6rem}
@media (min-width:560px){.actions{flex-direction:row;flex-wrap:wrap}.actions .btn.primary{order:-1}}
.qt{display:flex;align-items:center;gap:.7rem;font-weight:700;font-variant-numeric:tabular-nums}
.qt .bar{flex:1}
details.panel summary{cursor:pointer;font-weight:700;min-height:32px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.2rem + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:.7rem 1.1rem;border-radius:12px;font-weight:700;z-index:60;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--text);padding:1.3rem;max-width:min(92vw,460px);width:100%}
dialog::backdrop{background:rgba(5,8,22,.6)}
dialog h2{margin-bottom:.6rem}
dialog textarea{width:100%;min-height:160px;font:.8rem monospace;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:.6rem}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 0;border-top:1px solid var(--line);min-height:56px}
.toggle:first-of-type{border-top:0}
.toggle input{width:24px;height:24px;accent-color:var(--primary);flex:none}
.field{display:flex;flex-direction:column;gap:.35rem}
.field select{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);padding:0 .8rem;font:700 1rem "Atkinson Hyperlegible",sans-serif}
.boot{min-height:100vh;display:grid;place-items:center;color:var(--muted);font-weight:700}
.empty{text-align:center;padding:2rem 1rem;display:flex;flex-direction:column;align-items:center;gap:.8rem}
.empty .big{font-size:2.4rem}
.resbig{font:800 2.2rem Sora,sans-serif}
/* ---- Metax v0.003 ---- */
.orb{flex:none;display:block;overflow:visible}
.orb .halo{fill:none;stroke:hsl(var(--mh) 70% 52%);stroke-width:1.6;opacity:.55;transform-box:fill-box;transform-origin:center}
.orb .ring{fill:none;stroke:hsl(var(--mh) 75% 55%);stroke-width:1.8;opacity:.85}
:root:not([data-motion="reduced"]) .orb[data-st="welcome"]{animation:orbin .7s ease-out both}
:root:not([data-motion="reduced"]) .orb[data-st="success"] .halo{animation:orbpulse .7s ease-out 1 both}
:root:not([data-motion="reduced"]) .orb[data-st="hint"] .halo{animation:orbexp .8s ease-out 1 both}
@keyframes orbin{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@keyframes orbpulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.22);opacity:.3}}
@keyframes orbexp{from{transform:scale(.85);opacity:.2}to{transform:scale(1.08);opacity:.75}}
.mx{display:flex;gap:1rem;align-items:flex-start}
.mx .mxb{flex:1;min-width:0;display:flex;flex-direction:column;gap:.55rem}
.mx h2{font-size:1.15rem}
.mx.ok{border-color:var(--ok);background:var(--ok-soft)}
.mx.warm{border-color:var(--amber);background:var(--amber-soft)}
.card .card.mx{box-shadow:none;background:var(--surface2)}
.optc input:disabled+.box{opacity:.55}
.optc input:disabled{cursor:not-allowed}
@media (max-width:480px){.mx{gap:.7rem}}
/* ---- v0.003: Metax flotante, formas de estudio, simulaciones, tutor, notas ---- */
.orb .sk{fill:hsl(var(--mh) 55% 22%);stroke:#fff;stroke-width:1.6;stroke-linejoin:round}
.orb .lens{fill:#fff;fill-opacity:.25;stroke:#fff;stroke-width:1.8}
.orb .sk2{fill:none;stroke:hsl(var(--mh) 70% 48%);stroke-width:2.6;stroke-linecap:round}
.orb .sk3{fill:hsl(var(--mh) 70% 52%);stroke:none}
/* FIX-004: bloque Metax flotante consolidado (antes estaba duplicado en dos sitios) */
.mxw{position:fixed;z-index:40;right:14px;bottom:92px;width:64px;height:64px;display:flex;flex-direction:column;align-items:flex-end}
.mxbtn{width:100%;height:100%;border-radius:50%;border:0;background:transparent;padding:0;cursor:grab;touch-action:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.28))}
.mxbtn:active{cursor:grabbing}
.mxbtn.squish{animation:squish .45s cubic-bezier(.3,1.6,.5,1)}
.mxw.calm .mxbtn.squish{animation:none}

L3({id:'mat-tc-prop',ciclos:['tc'],subject:'mat',unit:'Unidad 1 · Aritmética, proporcionalidad y regla de tres',temario:'Proporcionalidad',title:'Proporcionalidad directa y regla de tres',skill:'Resolver problemas con magnitudes directamente proporcionales',diff:1,min:9,
 teoria:['Dos magnitudes son directamente proporcionales cuando su cociente es constante: si una se duplica, la otra también. Esa constante se llama constante de proporcionalidad.','La regla de tres simple directa resuelve problemas donde se conocen tres valores y se busca el cuarto: se plantea la proporción a ÷ b = c ÷ x y se despeja x multiplicando en cruz.','Se usa en recetas, mapas a escala, precios por unidad y conversiones de unidades. Antes de aplicarla conviene comprobar que la relación es realmente proporcional.'],
 historia:'Los problemas de proporción aparecen en papiros egipcios como el de Rhind (hacia 1650 a. C.), y los «Elementos» de Euclides (siglo III a. C.) desarrollan la teoría de razones. En la Edad Media el comercio extendió la «regla de tres», que los mercaderes valoraban tanto que a veces la llamaban «regla de oro».',
 personajes:[{n:'Euclides',d:'Matemático griego (c. 300 a. C.) que reunió en los «Elementos» la teoría de razones y proporciones, atribuida en gran parte a Eudoxo de Cnido.'}],
 formulas:['a ÷ b = c ÷ x','x = (b × c) ÷ a','k = y ÷ x (constante de proporcionalidad)'],
 ejemplos:[{t:'Precio de pupusas',pasos:['Datos: 4 pupusas cuestan $2 y quieres el costo de 10.','Planteo: 4 ÷ 2 = 10 ÷ x (pupusas ÷ dólares es constante).','Multiplica en cruz: 4 · x = 2 · 10 = 20.','Despeja: x = 20 ÷ 4 = 5.','Respuesta: 10 pupusas cuestan $5.']},
  {t:'Escala de un mapa',pasos:['Datos: 2 cm representan 5 km; ¿cuántos km son 7 cm?','Planteo: 2 ÷ 5 = 7 ÷ x.','Multiplica en cruz: 2x = 35.','Despeja: x = 35 ÷ 2 = 17,5.','Respuesta: 7 cm representan 17,5 km.']}],
 sim:'prop',
 cards:[
  C('Reconocer proporcionalidad','En la proporcionalidad directa el cociente y ÷ x no cambia.','Si 3 cuadernos cuestan $6, el cociente es 2: cada cuaderno cuesta $2.',mcq('¿Cuál tabla es de proporcionalidad directa?',['x: 1, 2, 3 · y: 3, 6, 9','x: 1, 2, 3 · y: 3, 5, 7','x: 1, 2, 3 · y: 9, 6, 3','x: 1, 2, 3 · y: 2, 4, 7'],0,'3 ÷ 1 = 6 ÷ 2 = 9 ÷ 3 = 3: el cociente es constante.','Divide cada y entre su x.')),
  C('Regla de tres','Se plantea a ÷ b = c ÷ x y se despeja x.','Si 3 cuadernos cuestan $6, 5 cuestan $10.',inp('Si 4 pupusas cuestan $2, ¿cuántos dólares cuestan 10 pupusas?',['5','5.00'],'Cada pupusa cuesta $0,50; 10 × 0,50 = $5.','Halla primero el precio de una.')),
  C('Escalas','En un plano a escala, la distancia real es proporcional a la del plano.','Si 2 cm del mapa son 5 km, 4 cm son 10 km.',inp('En un plano, 3 cm representan 12 m. ¿Cuántos metros representan 5 cm?',['20'],'Planteo: 3 ÷ 12 = 5 ÷ x, entonces x = 12 · 5 ÷ 3 = 20 m.','Cada centímetro equivale a 12 ÷ 3 metros.'))]}),
L3({id:'mat-tc-lin',ciclos:['tc'],subject:'mat',unit:'Unidad 2 · Ecuaciones lineales y productos notables',temario:'Ecuaciones lineales de primer grado',title:'Resolver ecuaciones lineales',skill:'Resolver ecuaciones de la forma ax + b = c',diff:1,min:9,
 teoria:['Una ecuación lineal de primer grado tiene la forma ax + b = c, con a ≠ 0. Resolverla es encontrar el valor de x que hace verdadera la igualdad.','El método es mantener el equilibrio: lo que haces en un lado debes hacerlo en el otro. Primero se elimina el término suelto (b) con la operación inversa y luego se divide entre a.','Siempre se comprueba sustituyendo el resultado en la ecuación original; así detectas errores de signo.'],
 historia:'El álgebra tomó su nombre de «al-jabr», una palabra del libro del matemático persa al-Juarismi (siglo IX) que describe cómo restaurar y equilibrar ecuaciones. En 1557 el galés Robert Recorde introdujo el signo «=» porque, según escribió, nada es más igual que dos rectas paralelas.',
 personajes:[{n:'Al-Juarismi',d:'Matemático persa del siglo IX cuyo libro sobre al-jabr dio origen a la palabra «álgebra» (y, por su nombre, a «algoritmo»).'},{n:'Robert Recorde',d:'Matemático galés (c. 1512–1558) que introdujo el signo «=» en su libro de 1557.'}],
 formulas:['ax + b = c','x = (c − b) ÷ a','Comprobación: a · x + b debe dar c'],
 ejemplos:[{t:'2x + 5 = 17',pasos:['Resta 5 en ambos lados: 2x = 12.','Divide ambos lados entre 2: x = 6.','Comprueba: 2 · 6 + 5 = 17. ✓']},
  {t:'3x − 4 = 11',pasos:['Suma 4 en ambos lados: 3x = 15.','Divide entre 3: x = 5.','Comprueba: 3 · 5 − 4 = 11. ✓']},
  {t:'Problema con texto',pasos:['«Ana gastó $7 y le quedaron $15. ¿Cuánto tenía?»','Planteo: x − 7 = 15.','Suma 7 en ambos lados: x = 22.','Respuesta: tenía $22.']}],
 sim:'lineal',
 cards:[
  C('Despejar x','Haz la misma operación en ambos lados hasta dejar x sola.','2x + 5 = 17 → 2x = 12 → x = 6.',inp('Resuelve 3x − 4 = 11.',['5'],'3x = 15, entonces x = 5.','Suma 4 en ambos lados.')),
  C('Con términos suelto','Primero elimina el término suelto y después divide.','5x + 3 = 28 → 5x = 25.',inp('Resuelve 5x + 3 = 28.',['5'],'5x = 25, entonces x = 5.','Resta 3 en ambos lados.')),
  C('Coeficientes negativos','Si x queda multiplicada por un número, divide entre ese número, aunque sea negativo.','−2x = 8 → x = −4.',mcq('Resuelve 2x − 7 = 9.',['x = 1','x = 8','x = 16','x = 2'],1,'2x = 16, entonces x = 8.','Suma 7 y luego divide entre 2.'))]}),
L3({id:'mat-tc-pit',ciclos:['tc'],subject:'mat',unit:'Unidad 4 · Geometría: semejanza y Pitágoras',temario:'Teorema de Pitágoras',title:'Teorema de Pitágoras',skill:'Calcular lados de un triángulo rectángulo',diff:2,min:9,
 teoria:['En un triángulo rectángulo, el lado más largo (hipotenusa) está frente al ángulo recto; los otros dos lados son los catetos.','El teorema de Pitágoras afirma que el cuadrado de la hipotenusa es igual a la suma de los cuadrados de los catetos: c² = a² + b².','Sirve para hallar una distancia desconocida cuando hay un ángulo recto: la diagonal de una cancha o la altura que alcanza una escalera apoyada en una pared.'],
 historia:'Una tablilla babilónica conocida como Plimpton 322 (c. 1800 a. C.) contiene números que forman ternas pitagóricas, y textos antiguos de la India y de China describen la relación entre los lados del triángulo rectángulo. Pitágoras de Samos y su escuela se asocian al teorema, y Euclides lo demostró en los «Elementos».',
 personajes:[{n:'Pitágoras de Samos',d:'Filósofo y matemático griego (c. 570–495 a. C.), fundador de una escuela que estudió los números y la geometría.'},{n:'Euclides',d:'Matemático griego (c. 300 a. C.) que incluyó una demostración del teorema en los «Elementos».'}],
 formulas:['c² = a² + b²','c = √(a² + b²)','a = √(c² − b²)'],
 ejemplos:[{t:'Hallar la hipotenusa',pasos:['Catetos: a = 3 y b = 4.','c² = 3² + 4² = 9 + 16 = 25.','c = √25 = 5.']},
  {t:'La escalera',pasos:['Una escalera de 5 m apoya su base a 3 m de la pared; la escalera es la hipotenusa (c = 5).','a² = c² − b² = 25 − 9 = 16.','a = √16 = 4.','Respuesta: alcanza 4 m de altura.']},
  {t:'Diagonal de un rectángulo',pasos:['Un rectángulo mide 6 m por 8 m; la diagonal es la hipotenusa.','d² = 6² + 8² = 36 + 64 = 100.','d = √100 = 10 m.']}],
 sim:'pitagoras',
 cards:[
  C('Hipotenusa','La hipotenusa es la raíz de la suma de los cuadrados de los catetos.','Con catetos 3 y 4: c = √(9 + 16) = 5.',inp('Los catetos de un triángulo rectángulo miden 6 y 8. ¿Cuánto mide la hipotenusa?',['10'],'c² = 36 + 64 = 100, entonces c = 10.','Suma los cuadrados antes de sacar la raíz.')),
  C('Ternas pitagóricas','Tres números enteros a, b y c que cumplen a² + b² = c² forman una terna pitagórica.','3, 4, 5: 9 + 16 = 25.',mcq('¿Cuál es una terna pitagórica?',['5, 12, 13','4, 5, 6','6, 7, 8','2, 3, 4'],0,'5² + 12² = 25 + 144 = 169 = 13².','Comprueba si el cuadrado mayor es la suma de los otros dos.')),
  C('Un cateto desconocido','Si conoces la hipotenusa y un cateto, resta los cuadrados.','a² = c² − b².',inp('Una escalera de 13 m apoya su base a 5 m de la pared. ¿Qué altura alcanza, en m?',['12'],'a² = 169 − 25 = 144, entonces a = 12 m.','Resta 5² a 13².'))]}),

L3({id:'mat-em-des',ciclos:['em'],subject:'mat',unit:'Unidad 3 · Desigualdades',temario:'Lineales',title:'Desigualdades lineales',skill:'Resolver y representar desigualdades de primer grado',diff:2,min:9,
 teoria:['Una desigualdad compara dos expresiones con <, ≤, > o ≥. Su solución no es un único número sino un conjunto de valores, que se representa en la recta numérica y como intervalo.','Se resuelve como una ecuación, con una regla extra: al multiplicar o dividir ambos lados por un número negativo, el sentido de la desigualdad se invierte.','En la recta, un círculo abierto indica que el extremo no está incluido (< o >); uno cerrado, que sí lo está (≤ o ≥).'],
 historia:'Los símbolos < y > se deben al matemático inglés Thomas Harriot, y aparecieron en un libro publicado después de su muerte, en 1631. Antes, las comparaciones se escribían con palabras.',
 personajes:[{n:'Thomas Harriot',d:'Matemático y astrónomo inglés (c. 1560–1621), a quien se atribuyen los símbolos < y >.'}],
 formulas:['ax + b < c ⇒ x < (c − b) ÷ a, si a > 0','Si a < 0, el signo se invierte: x > (c − b) ÷ a','x > 4 se escribe como intervalo (4, ∞)'],
 ejemplos:[{t:'2x + 3 > 11',pasos:['Resta 3: 2x > 8.','Divide entre 2 (positivo): x > 4.','Intervalo (4, ∞), con círculo abierto en 4.']},
  {t:'−3x + 2 ≤ 11',pasos:['Resta 2: −3x ≤ 9.','Divide entre −3: el signo se invierte y queda x ≥ −3.','Intervalo [−3, ∞), con círculo cerrado en −3.']}],
 sim:'desig',
 cards:[
  C('Resolver una desigualdad','Se resuelve como una ecuación; el signo solo cambia si divides o multiplicas por un negativo.','2x + 3 > 11 → 2x > 8 → x > 4.',mcq('Resuelve: 3x − 5 ≤ 10',['x ≤ 5','x ≥ 5','x ≤ 15','x ≤ 3'],0,'3x ≤ 15, así que x ≤ 5. No dividimos entre un negativo.','Suma 5 y luego divide entre 3.')),
  C('El signo que se invierte','Dividir entre un número negativo invierte el sentido.','−2x < 6 → x > −3.',mcq('Resuelve: −2x > 6',['x < −3','x > −3','x < 3','x > 3'],0,'Al dividir entre −2 el signo se invierte: x < −3.','Recuerda la regla del signo negativo.')),
  C('Valores enteros','Los enteros que cumplen una desigualdad son los que están en su intervalo.','x > 4 incluye 5, 6, 7…',inp('¿Cuál es el menor entero que cumple x + 4 > 9?',['6'],'x > 5, así que el menor entero es 6.','Resta 4 en ambos lados.'))]}),
L3({id:'mat-em-cuad',ciclos:['em'],subject:'mat',unit:'Unidad 4 · Funciones Reales',temario:'Función cuadrática',title:'Función cuadrática y vértice',skill:'Hallar el vértice y los extremos de una parábola',diff:2,min:10,
 teoria:['Una función cuadrática tiene la forma f(x) = ax² + bx + c con a ≠ 0. Su gráfica, la parábola, es simétrica respecto de la recta vertical que pasa por el vértice.','El vértice está en x = −b ÷ (2a). Si a > 0 la parábola abre hacia arriba y el vértice es un mínimo; si a < 0 abre hacia abajo y es un máximo.','Por eso aparece en problemas de optimización, como hallar la altura máxima de un objeto lanzado al aire.'],
 historia:'Apolonio de Perge (siglo III a. C.) estudió las cónicas y dio nombre a la parábola, la elipse y la hipérbola. En el siglo XVII, Galileo mostró que un proyectil describe una trayectoria parabólica y Descartes unió álgebra y geometría, lo que permitió graficar funciones.',
 personajes:[{n:'Apolonio de Perge',d:'Matemático griego (c. 262–190 a. C.) que estudió las cónicas.'},{n:'René Descartes',d:'Filósofo y matemático francés (1596–1650). Su «Geometría» (1637) unió álgebra y geometría.'},{n:'Galileo Galilei',d:'Astrónomo y físico italiano (1564–1642) que describió la trayectoria parabólica de los proyectiles.'}],
 formulas:['f(x) = ax² + bx + c','Vértice: x = −b ÷ (2a)','Altura del vértice: f(−b ÷ (2a))'],
 ejemplos:[{t:'Vértice de x² − 4x + 3',pasos:['a = 1, b = −4.','x = −b ÷ (2a) = 4 ÷ 2 = 2.','f(2) = 4 − 8 + 3 = −1.','El vértice es (2, −1) y es un mínimo, porque a > 0.']},
  {t:'Altura máxima de una pelota',pasos:['h(t) = −5t² + 20t; a = −5, b = 20, así que hay un máximo.','t = −20 ÷ (2 · (−5)) = 2 s.','h(2) = −5 · 4 + 40 = 20 m.','Respuesta: a los 2 s alcanza 20 m.']}],
 sim:'cuadratica',
 cards:[
  C('Vértice de una parábola','El vértice está en x = −b ÷ (2a).','En f(x) = x² − 4x + 3 el vértice es (2, −1).',inp('¿Cuál es la coordenada x del vértice de f(x) = x² − 6x + 5?',['3'],'x = −(−6) ÷ (2·1) = 3.','Usa x = −b ÷ (2a) con a = 1 y b = −6.')),
  C('Máximo o mínimo','El signo de a decide si el vértice es mínimo o máximo.','g(x) = −x² + 4 tiene un máximo de 4.',mcq('¿Qué tiene f(x) = −2x² + 8x: un máximo o un mínimo?',['Un máximo','Un mínimo','Ninguno','Los dos'],0,'Como a = −2 < 0, la parábola abre hacia abajo y el vértice es un máximo.','Mira el signo de a.')),
  C('Valor del extremo','Para el valor máximo o mínimo, evalúa f en el vértice.','f(x) = −x² + 6x: x = 3, f(3) = 9.',inp('¿Cuál es el valor máximo de f(x) = −x² + 6x?',['9'],'x = 3 y f(3) = −9 + 18 = 9.','Primero halla x del vértice.'))]}),

L3({id:'cfi-mru',ciclos:['tc'],subject:'cfi',unit:'Unidad 1 · Cinemática y Dinámica',temario:'Movimiento rectilíneo',title:'Movimiento rectilíneo uniforme',skill:'Calcular distancia, tiempo y rapidez en el MRU',diff:1,min:8,
 teoria:['El movimiento rectilíneo uniforme (MRU) ocurre en línea recta y con rapidez constante: el objeto recorre distancias iguales en tiempos iguales.','Su ecuación es d = v · t. La gráfica distancia–tiempo es una recta; mientras mayor es la pendiente, mayor es la rapidez.','La rapidez se mide en m/s o km/h. Para convertir de km/h a m/s se divide entre 3,6.'],
 historia:'Aristóteles pensaba que un cuerpo necesitaba una fuerza continua para seguir moviéndose. Galileo Galilei (1564–1642) estudió el movimiento con planos inclinados y preparó la idea de inercia, que Newton formalizó en 1687.',
 personajes:[{n:'Galileo Galilei',d:'Astrónomo y físico italiano (1564–1642) que estudió el movimiento con experimentos.'}],
 formulas:['v = d ÷ t','d = v · t','t = d ÷ v','km/h ÷ 3,6 = m/s'],
 ejemplos:[{t:'Distancia de un ciclista',pasos:['Datos: v = 6 m/s y t = 25 s.','d = v · t = 6 · 25.','d = 150 m.']},
  {t:'Convertir 72 km/h a m/s',pasos:['Dato: 72 km/h, y 1 m/s equivale a 3,6 km/h.','Divide entre 3,6: 72 ÷ 3,6 = 20.','Respuesta: 72 km/h = 20 m/s.']},
  {t:'Tiempo de un viaje',pasos:['Un bus recorre 90 km a 60 km/h.','t = d ÷ v = 90 ÷ 60.','t = 1,5 h, es decir, 1 h y 30 min.']}],
 sim:'mru',
 cards:[
  C('Rapidez constante','Con rapidez constante, v = d ÷ t.','Si recorres 120 m en 20 s, v = 6 m/s.',inp('Un ciclista recorre 150 m en 25 s con rapidez constante. ¿Cuál es su rapidez, en m/s?',['6'],'v = 150 ÷ 25 = 6 m/s.','Divide la distancia entre el tiempo.')),
  C('Distancia recorrida','La distancia es rapidez por tiempo.','A 20 m/s durante 10 s se recorren 200 m.',inp('Un auto viaja a 20 m/s durante 15 s. ¿Qué distancia recorre, en m?',['300'],'d = 20 · 15 = 300 m.','Multiplica la rapidez por el tiempo.')),
  C('Cambio de unidades','Para pasar de km/h a m/s, divide entre 3,6.','36 km/h = 10 m/s.',inp('Convierte 54 km/h a m/s.',['15'],'54 ÷ 3,6 = 15 m/s.','Divide entre 3,6.'))]}),
L3({id:'fis-newton',ciclos:['em'],subject:'fis',unit:'Unidad 1 · Cinemática y Dinámica',temario:'Leyes de Newton',title:'Leyes de Newton',skill:'Aplicar F = m·a y reconocer pares acción-reacción',diff:2,min:10,
 teoria:['La primera ley (inercia) dice que un cuerpo mantiene su reposo o su movimiento rectilíneo uniforme mientras la fuerza neta sobre él sea cero.','La segunda ley relaciona fuerza, masa y aceleración: F = m·a. Con la misma fuerza, a mayor masa, menor aceleración.','La tercera ley dice que si un cuerpo ejerce una fuerza sobre otro, el segundo ejerce sobre el primero una fuerza igual y de sentido contrario; ambas actúan sobre cuerpos distintos.'],
 historia:'Newton publicó sus tres leyes en 1687, en los «Philosophiæ Naturalis Principia Mathematica». Antes, Galileo había mostrado que, sin rozamiento, un cuerpo en movimiento tiende a seguir moviéndose, idea que se convirtió en la primera ley.',
 personajes:[{n:'Isaac Newton',d:'Matemático y físico inglés (1643–1727), autor de los «Principia» (1687).'},{n:'Galileo Galilei',d:'Astrónomo y físico italiano (1564–1642) cuyos estudios prepararon la idea de inercia.'}],
 formulas:['F = m · a','a = F ÷ m','Peso: P = m · g, con g ≈ 9,8 m/s²','Acción y reacción: F(A sobre B) = −F(B sobre A)'],
 ejemplos:[{t:'Aceleración de un objeto',pasos:['Datos: F = 20 N y m = 4 kg.','a = F ÷ m = 20 ÷ 4.','a = 5 m/s².']},
  {t:'Peso de 5 kg',pasos:['El peso es una fuerza: P = m · g.','P = 5 · 9,8.','P = 49 N.']},
  {t:'Fuerza necesaria',pasos:['Quieres acelerar 3 m/s² un objeto de 2 kg.','F = m · a = 2 · 3.','F = 6 N.']}],
 sim:'newton',
 cards:[
  C('Segunda ley: F = m·a','La fuerza neta es igual a masa por aceleración.','10 N sobre 2 kg producen 5 m/s².',inp('Una fuerza neta de 20 N actúa sobre un objeto de 4 kg. ¿Qué aceleración produce, en m/s²?',['5'],'a = 20 ÷ 4 = 5 m/s².','Despeja a en F = m·a.')),
  C('Tercera ley: acción y reacción','Las fuerzas de acción y reacción son iguales y de sentido contrario.','Al empujar una pared, la pared te empuja con la misma fuerza.',mcq('Al empujar una pared con 30 N, la pared…',['te empuja con 30 N en sentido contrario','no ejerce ninguna fuerza','te empuja con 15 N','te empuja con 60 N'],0,'Acción y reacción tienen el mismo valor y sentidos contrarios.','Las fuerzas de acción y reacción son iguales.')),
  C('Calcular la fuerza','Si conoces masa y aceleración, la fuerza es su producto.','2 kg con 3 m/s² requieren 6 N.',inp('¿Qué fuerza neta, en N, acelera 3 m/s² un objeto de 2 kg?',['6'],'F = 2 · 3 = 6 N.','Multiplica masa por aceleración.'))]}),
L3({id:'fis-arq',ciclos:['em'],subject:'fis',unit:'Unidad 2 · Trabajo, Energía y Mecánica de Fluidos',temario:'Principios de Pascal y Arquímedes',title:'Principios de Arquímedes y Pascal',skill:'Calcular empuje y transmisión de presión',diff:2,min:10,
 teoria:['Según el principio de Arquímedes, un cuerpo sumergido recibe un empuje hacia arriba igual al peso del fluido que desplaza: E = ρ · V · g. Un objeto flota si su densidad es menor que la del fluido.','Según el principio de Pascal, la presión aplicada a un fluido encerrado se transmite sin pérdida a todos sus puntos. La presión es fuerza entre área: P = F ÷ A.','Con ambos principios se explican los barcos, los submarinos, los frenos hidráulicos y los gatos que levantan autos.'],
 historia:'Arquímedes (siglo III a. C.) vivió en Siracusa. Cuenta la tradición que halló la relación entre empuje y volumen desplazado al sumergirse en una bañera. Blaise Pascal estudió la presión en los fluidos en el siglo XVII, y su nombre quedó en la unidad de presión.',
 personajes:[{n:'Arquímedes',d:'Sabio griego de Siracusa (c. 287–212 a. C.), matemático, físico e ingeniero.'},{n:'Blaise Pascal',d:'Matemático y físico francés (1623–1662) que estudió la presión en los fluidos.'}],
 formulas:['E = ρ · V · g','Flota si ρ del objeto < ρ del fluido','P = F ÷ A','Pascal: F₁ ÷ A₁ = F₂ ÷ A₂'],
 ejemplos:[{t:'Empuje sobre un objeto',pasos:['Un objeto desplaza 2 L de agua; ρ del agua ≈ 1 kg/L, así que la masa desplazada es 2 kg.','Empuje = peso del agua desplazada = m · g.','E = 2 · 9,8 = 19,6 N.']},
  {t:'Gato hidráulico',pasos:['Émbolos: A₁ = 2 cm² y A₂ = 50 cm²; se aplican F₁ = 40 N.','Planteo: F₁ ÷ A₁ = F₂ ÷ A₂.','F₂ = F₁ · A₂ ÷ A₁ = 40 · 50 ÷ 2.','F₂ = 1000 N.']}],
 sim:'arq',
 cards:[
  C('Principio de Arquímedes','El empuje es el peso del fluido desplazado.','Un objeto que desplaza 1 L de agua recibe unos 9,8 N.',inp('Un objeto sumergido desplaza 2 kg de agua. ¿Qué empuje recibe, en N? (usa g = 9,8 m/s²)',['19.6'],'Empuje = 2 × 9,8 = 19,6 N.','Calcula el peso del agua: masa × 9,8.')),
  C('Principio de Pascal','La presión se transmite por igual en un fluido encerrado.','Un freno hidráulico transmite la presión del pedal a las ruedas.',mcq('¿Qué principio explica el funcionamiento de un gato hidráulico?',['Principio de Pascal','Principio de Arquímedes','Ley de Coulomb','Primera ley de Newton'],0,'La presión se transmite por igual en un fluido encerrado.','Piensa en la presión en un fluido encerrado.')),
  C('Fuerza en el émbolo grande','F₂ = F₁ · A₂ ÷ A₁.','Con áreas 2 cm² y 50 cm², la fuerza se multiplica por 25.',inp('Un gato hidráulico tiene émbolos de 2 cm² y 50 cm². Si aplicas 40 N en el pequeño, ¿qué fuerza, en N, aparece en el grande?',['1000'],'F₂ = 40 · 50 ÷ 2 = 1000 N.','Multiplica por la razón de áreas.'))]}),
/* ================= QUÍMICA ================= */
L3({id:'qui-mol',ciclos:['em'],subject:'qui',unit:'Unidad 3 · Estequiometría y Soluciones',temario:'Concepto de mol',title:'Concepto de mol',skill:'Relacionar masa, mol y masa molar',diff:2,min:10,
 teoria:['Un mol es la cantidad de sustancia que contiene 6,022 × 10²³ partículas (el número de Avogadro). Permite contar átomos y moléculas pesando una muestra.','La masa de un mol, en gramos, es la masa molar. Se obtiene sumando las masas atómicas de los átomos de la fórmula: en el agua (H₂O), 2 × 1 + 16 ≈ 18 g/mol.','Con la masa molar se pasa de gramos a moles (n = m ÷ M) y de moles a gramos (m = n · M).'],
 historia:'En 1811 Amedeo Avogadro propuso que volúmenes iguales de gases contienen el mismo número de moléculas. El valor del número que hoy lleva su nombre se determinó experimentalmente décadas después; Jean Perrin lo midió con precisión a comienzos del siglo XX y recibió el Premio Nobel de Física en 1926.',
 personajes:[{n:'Amedeo Avogadro',d:'Físico y químico italiano (1776–1856).'},{n:'Jean Perrin',d:'Físico francés (1870–1942) que midió el número de Avogadro y recibió el Nobel de Física en 1926.'}],
 formulas:['n = m ÷ M','m = n · M','N = n · 6,022 × 10²³'],
 ejemplos:[{t:'De gramos a moles',pasos:['Datos: 36 g de agua y M = 18 g/mol.','n = m ÷ M = 36 ÷ 18.','n = 2 mol.']},
  {t:'De moles a gramos',pasos:['Datos: 0,5 mol de CO₂ y M = 44 g/mol.','m = n · M = 0,5 · 44.','m = 22 g.']},
  {t:'Cantidad de moléculas',pasos:['Datos: 2 mol de agua.','N = n · 6,022 × 10²³ = 2 · 6,022 × 10²³.','N = 12,044 × 10²³ ≈ 1,2 × 10²⁴ moléculas.']}],
 sim:'mol',
 cards:[
  C('El mol','Un mol contiene 6,022 × 10²³ partículas; su masa en gramos es la masa molar.','18 g de agua son 1 mol de moléculas.',inp('¿Cuántos moles hay en 36 g de agua (masa molar 18 g/mol)?',['2'],'n = 36 ÷ 18 = 2 mol.','Divide la masa entre la masa molar.')),
  C('De moles a gramos','Para pasar de moles a gramos se multiplica por la masa molar.','2 mol de agua pesan 36 g.',inp('¿Cuántos gramos son 0,5 mol de CO₂ (masa molar 44 g/mol)?',['22'],'0,5 × 44 = 22 g.','Multiplica los moles por la masa molar.')),
  C('Con sal común','La misma relación funciona para cualquier sustancia.','NaCl tiene M ≈ 58,5 g/mol.',inp('¿Cuántos moles hay en 117 g de NaCl (masa molar 58,5 g/mol)?',['2'],'n = 117 ÷ 58,5 = 2 mol.','Divide 117 entre 58,5.'))]}),
L3({id:'qui-conf',ciclos:['em'],subject:'qui',unit:'Unidad 1 · Estructura Atómica y Tabla Periódica',temario:'Configuración electrónica',title:'Configuración electrónica',skill:'Escribir configuraciones y hallar electrones de valencia',diff:2,min:9,
 teoria:['La configuración electrónica indica cómo se distribuyen los electrones en niveles y subniveles. Cada subnivel tiene una capacidad máxima: s admite 2 electrones y p admite 6.','Los subniveles se llenan en orden de energía creciente: 1s, 2s, 2p, 3s, 3p. Para los primeros 18 elementos basta recordar ese orden.','Los electrones del nivel más alto son los electrones de valencia, y determinan buena parte del comportamiento químico del elemento.'],
 historia:'Niels Bohr propuso en 1913 que los electrones ocupan niveles de energía definidos. En 1925 Wolfgang Pauli formuló el principio de exclusión: dos electrones de un átomo no pueden compartir los mismos cuatro números cuánticos, lo que explica por qué cada subnivel tiene una capacidad limitada.',
 personajes:[{n:'Niels Bohr',d:'Físico danés (1885–1962) que propuso en 1913 un modelo con niveles de energía.'},{n:'Wolfgang Pauli',d:'Físico austriaco (1900–1958) que formuló en 1925 el principio de exclusión.'}],
 formulas:['Capacidad: s = 2 e⁻ y p = 6 e⁻','Orden de llenado: 1s 2s 2p 3s 3p','Electrones de valencia = electrones del nivel más alto'],
 ejemplos:[{t:'Oxígeno (Z = 8)',pasos:['Hay 8 electrones: 1s² (2), 2s² (2) y 2p⁴ (4).','Configuración: 1s² 2s² 2p⁴.','Nivel más alto: n = 2, con 2 + 4 = 6 electrones.','El oxígeno tiene 6 electrones de valencia.']},
  {t:'Sodio (Z = 11)',pasos:['1s² 2s² 2p⁶ completan 10 electrones.','El electrón 11 va al subnivel 3s: 3s¹.','Configuración: 1s² 2s² 2p⁶ 3s¹.','El sodio tiene 1 electrón de valencia.']}],
 sim:'conf',
 cards:[
  C('Niveles y subniveles','Los electrones del último nivel son los de valencia.','Oxígeno: 1s² 2s² 2p⁴ tiene 6 electrones de valencia.',inp('¿Cuántos electrones de valencia tiene el oxígeno (1s² 2s² 2p⁴)?',['6'],'En el nivel 2 hay 2 + 4 = 6 electrones.','Suma los electrones de 2s y 2p.')),
  C('Un solo electrón de valencia','Si el último nivel tiene un electrón, el elemento tiene valencia 1.','Sodio: 1s² 2s² 2p⁶ 3s¹.',inp('¿Cuántos electrones de valencia tiene el sodio (Z = 11)?',['1'],'Su último nivel es 3s¹: un electrón.','Fíjate en el nivel 3.')),
  C('Gases nobles','Un nivel externo completo da una configuración muy estable.','El neón tiene el nivel 2 completo.',mcq('¿Cuál es la configuración del neón (Z = 10)?',['1s² 2s² 2p⁶','1s² 2s² 2p⁴','1s² 2s² 2p⁵','1s² 2s² 3s²'],0,'Con 10 electrones se llenan 1s (2), 2s (2) y 2p (6).','Suma 2 + 2 + 6.'))]}),
