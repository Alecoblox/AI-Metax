<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Metax v0.002 — Aprende a tu ritmo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Sora:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F2F4FB; --bg2:#E6EAF7; --surface:#FFFFFF; --surface2:#F7F8FD; --line:#D0D8EF;
  --text:#121833; --muted:#4A557F;
  --primary:#4B3FD6; --on-primary:#FFFFFF; --primary-soft:#E7E4FF;
  --amber:#8A5600; --amber-soft:#FFEBC2;
  --ok:#0A7650; --ok-soft:#D5F5E7; --bad:#B02E1C; --bad-soft:#FFE1DC;
  --grid:rgba(75,63,214,.11); --shadow:0 1px 0 rgba(18,24,51,.04),0 14px 30px -20px rgba(18,24,51,.4);
  --focus:#4B3FD6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F23; --bg2:#10183A; --surface:#141C3D; --surface2:#1A244C; --line:#2A3664;
    --text:#EEF2FF; --muted:#A8B3DA;
    --primary:#9A91FF; --on-primary:#0A0F23; --primary-soft:#262D66;
    --amber:#FFC15A; --amber-soft:#3A2D10;
    --ok:#4FE3A8; --ok-soft:#0F3A2E; --bad:#FF8F80; --bad-soft:#46211D;
    --grid:rgba(154,145,255,.11); --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 30px -20px rgba(0,0,0,.8);
    --focus:#9A91FF;
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F23; --bg2:#10183A; --surface:#141C3D; --surface2:#1A244C; --line:#2A3664;
  --text:#EEF2FF; --muted:#A8B3DA;
  --primary:#9A91FF; --on-primary:#0A0F23; --primary-soft:#262D66;
  --amber:#FFC15A; --amber-soft:#3A2D10;
  --ok:#4FE3A8; --ok-soft:#0F3A2E; --bad:#FF8F80; --bad-soft:#46211D;
  --grid:rgba(154,145,255,.11); --shadow:0 1px 0 rgba(0,0,0,.2),0 14px 30px -20px rgba(0,0,0,.8);
  --focus:#9A91FF;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
[hidden]{display:none!important}
body{
  margin:0;min-height:100%;background-color:var(--bg);color:var(--text);
  font:400 1rem/1.55 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background-image:radial-gradient(var(--grid) 1.1px,transparent 1.4px);background-size:26px 26px;
  -webkit-text-size-adjust:100%;
}
h1,h2,h3{font-family:Sora,"Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.2;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(1.55rem,4.2vw,2.1rem);font-weight:800}
h2{font-size:1.2rem;font-weight:700}
h3{font-size:1.02rem;font-weight:700}
p{margin:0}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
h1:focus,#main:focus,.fbh:focus,.qprompt:focus{outline:none}
.skip{position:absolute;left:-999px;top:0;background:var(--primary);color:var(--on-primary);padding:.6rem 1rem;z-index:100;border-radius:0 0 10px 0}
.skip:focus{left:0}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* shell */
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.col{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:.6rem;padding:.6rem 1rem;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .sp{flex:1}
.logo{display:inline-flex;align-items:center;gap:.5rem;font:800 1.15rem Sora,sans-serif;color:var(--text);text-decoration:none}
.logo svg{width:28px;height:28px;color:var(--primary)}
.iconbtn{display:inline-flex;align-items:center;gap:.4rem;min-height:44px;min-width:44px;padding:0 .8rem;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);text-decoration:none;font-weight:700;font-size:.92rem;position:relative;cursor:pointer}
.iconbtn svg{width:20px;height:20px}
.iconbtn .cnt{background:var(--amber-soft);color:var(--amber);border-radius:99px;padding:0 .45rem;font-size:.8rem;min-width:1.4rem;text-align:center}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--on-primary);font:800 1rem Sora,sans-serif;text-decoration:none}
main{padding:1.2rem 1rem 7rem;max-width:960px;margin:0 auto;width:100%}
.ph{margin-bottom:1.3rem}
.ph p{color:var(--muted);margin-top:.35rem}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:.35rem .4rem calc(.35rem + env(safe-area-inset-bottom,0px))}
.bottom a{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.45rem .2rem;min-height:56px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:.78rem;font-weight:700}
.bottom a svg{width:24px;height:24px}
.bottom a[aria-current="page"]{color:var(--primary);background:var(--primary-soft)}
@media (min-width:900px){
  .shell{grid-template-columns:250px 1fr}
  .side{display:flex;flex-direction:column;gap:1.4rem;padding:1.4rem 1rem;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;border-right:1px solid var(--line);min-height:100%}
  .side nav{display:flex;flex-direction:column;gap:.25rem}
  .side nav a{display:flex;align-items:center;gap:.7rem;padding:.7rem .8rem;border-radius:12px;color:var(--text);text-decoration:none;font-weight:700;min-height:46px}
  .side nav a svg{width:22px;height:22px;color:var(--muted)}
  .side nav a[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
  .side nav a[aria-current="page"] svg{color:var(--primary)}
  .side nav a:hover{background:var(--surface2)}
  .bottom{display:none}
  .top .logo{display:none}
  main{padding:1.8rem 2rem 3rem}
}
@media (min-width:600px) and (max-width:899px){ main{padding:1.5rem 1.6rem 7rem} }

/* basics */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:46px;padding:.65rem 1.15rem;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:700 1rem "Atkinson Hyperlegible",system-ui,sans-serif;cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:transparent}
.btn.primary:hover{filter:brightness(1.06)}
.btn.lg{min-height:54px;padding:.8rem 1.6rem;font-size:1.08rem;border-radius:14px}
.btn.sm{min-height:40px;padding:.4rem .85rem;font-size:.92rem;border-radius:10px}
.btn.quiet{border-color:transparent;background:transparent;color:var(--primary)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:1.1rem 1.2rem;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:1rem}
.row{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center}
.grid2{display:grid;gap:1rem;grid-template-columns:1fr}
.grid3{display:grid;gap:.8rem;grid-template-columns:1fr}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}.grid3{grid-template-columns:repeat(3,1fr)}}
.section{margin-top:1.8rem}
.section>h2{margin-bottom:.8rem}
.chip{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .7rem;border-radius:99px;background:var(--surface2);border:1px solid var(--line);font-size:.88rem;font-weight:700;color:var(--muted)}
.chip.btnlike{cursor:pointer;min-height:40px;font:700 .95rem "Atkinson Hyperlegible",sans-serif;color:var(--text)}
.chip.on,.chip[aria-pressed="true"]{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
.badge{display:inline-block;padding:.05rem .55rem;border-radius:8px;font-size:.8rem;font-weight:700;background:var(--amber-soft);color:var(--amber)}
.bar{height:10px;border-radius:6px;background:var(--bg2);position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;display:block;background:var(--primary);border-radius:6px}
.bar i.p{opacity:.4}
.sti{flex:none}
.st-nuevo{color:var(--muted)}.st-practica{color:var(--amber)}.st-practicado{color:var(--primary)}.st-dominado{color:var(--ok)}
.banner{border-radius:12px;padding:.7rem 1rem;margin-bottom:1rem;font-weight:700;border:1px solid var(--line);background:var(--amber-soft);color:var(--amber)}
.hue{--h:255;background:hsl(var(--h) 70% 52% / .17);display:grid;place-items:center;border-radius:14px;width:52px;height:52px;font-size:1.6rem;flex:none}
.link{background:none;border:0;color:var(--primary);font:700 1rem "Atkinson Hyperlegible",sans-serif;text-decoration:underline;cursor:pointer;padding:.5rem;min-height:44px}

/* home */
.hero{background:var(--primary-soft);border-color:var(--primary);display:flex;flex-direction:column;gap:.9rem}
.hero h2{font-size:clamp(1.3rem,3.4vw,1.7rem)}
.hero .why{color:var(--muted)}
.mode{display:flex;flex-direction:column;gap:.35rem;text-align:left;width:100%;cursor:pointer;color:var(--text);font:inherit;text-decoration:none;padding:1rem 1.1rem}
.mode strong{font:700 1.05rem Sora,sans-serif}
.mode span{color:var(--muted);font-size:.93rem}
.mode:hover{border-color:var(--primary)}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg label{position:relative;display:block}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;padding:.55rem 1rem;min-height:44px;font-weight:700;display:flex;align-items:center}
.seg input:checked+span{background:var(--primary);color:var(--on-primary)}
.seg input:focus-visible+span{outline:3px solid var(--focus);outline-offset:-3px}
.route{list-style:none;margin:0;padding:0}
.route li{position:relative;padding:.2rem 0 .2rem 3.2rem;min-height:68px}
.route li::before{content:"";position:absolute;left:1.1rem;top:0;bottom:0;border-left:2px dashed var(--line)}
.route li:first-child::before{top:1.5rem}
.route li:last-child::before{bottom:calc(100% - 1.5rem)}
.route li:only-child::before{display:none}
.route .node{position:absolute;left:.1rem;top:.55rem;width:2.1rem;height:2.1rem;border-radius:50%;background:var(--bg);display:grid;place-items:center}
.route a{display:flex;flex-direction:column;gap:.1rem;padding:.55rem .9rem;border-radius:14px;text-decoration:none;color:var(--text);border:1px solid transparent}
.route a:hover{background:var(--surface);border-color:var(--line)}
.route .cur a{background:var(--surface);border-color:var(--primary)}
.route .sub{color:var(--muted);font-size:.9rem}
.subjrow{display:flex;align-items:center;gap:.9rem;padding:.8rem 0;border-top:1px solid var(--line)}
.subjrow:first-child{border-top:0}
.subjrow .grow{flex:1;min-width:0}
.subjrow .grow .bar{margin:.4rem 0 .25rem}
.trow{display:flex;align-items:center;gap:.8rem;padding:.8rem 1rem;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:var(--text);min-height:60px}
.trow:hover{border-color:var(--primary)}
.trow .tmain{flex:1;min-width:0;display:flex;flex-direction:column}
.trow .sub{color:var(--muted);font-size:.9rem}
.trow .stl{font-size:.88rem;font-weight:700;color:var(--muted)}
.scard{display:flex;gap:1rem;align-items:center;text-decoration:none;color:var(--text)}
.scard:hover{border-color:var(--primary)}
.scard .grow{flex:1;min-width:0}
.scard .bar{margin:.4rem 0 .2rem}
.unit{margin-top:1.4rem}
.unit>h3{margin-bottom:.6rem;color:var(--muted);font-family:"Atkinson Hyperlegible",sans-serif}
.tiles{display:grid;gap:.7rem;grid-template-columns:repeat(2,1fr)}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:.8rem 1rem}
.tile b{display:block;font:800 1.6rem Sora,sans-serif}
.tile span{color:var(--muted);font-size:.9rem}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:.5rem;align-items:end;height:150px}
.week .d{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:.25rem;font-size:.82rem;color:var(--muted)}
.week .col2{width:100%;max-width:38px;background:var(--primary);border-radius:8px 8px 3px 3px;min-height:4px}
.week .d.today b{color:var(--primary)}
dl.meta{display:grid;grid-template-columns:auto 1fr;gap:.45rem 1.1rem;margin:0}
dl.meta dt{color:var(--muted)}dl.meta dd{margin:0;font-weight:700}

/* onboarding */
.ob{min-height:100%;display:flex;align-items:center;justify-content:center;padding:1.2rem}
.obc{width:100%;max-width:520px;display:flex;flex-direction:column;gap:1.2rem}
.opts{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:.6rem}
.optc{position:relative;display:block}
.optc input{position:absolute;opacity:0;inset:0;width:100%;height:100%;cursor:pointer;margin:0}
.optc .box{display:flex;align-items:center;gap:.8rem;padding:.9rem 1rem;min-height:58px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);font-weight:700}
.optc .box small{display:block;font-weight:400;color:var(--muted)}
.optc .k{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.85rem;color:var(--muted)}
.optc input:checked+.box{border-color:var(--primary);background:var(--primary-soft)}
.optc input:checked+.box .k{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.optc input:focus-visible+.box{outline:3px solid var(--focus);outline-offset:2px}
.optc.good input:checked+.box{border-color:var(--ok);background:var(--ok-soft)}
.constel{width:100%;height:auto;max-height:240px}
.constel .path{fill:none;stroke:var(--primary);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:640;stroke-dashoffset:0}
.constel .nd{fill:var(--bg);stroke:var(--primary);stroke-width:2.5}
.constel text{fill:var(--muted);font:700 11px "Atkinson Hyperlegible",sans-serif}
.constel .star{fill:var(--amber)}
:root:not([data-motion="reduced"]) .constel .path{animation:draw 2.4s ease-out both}
:root:not([data-motion="reduced"]) .constel .nd,:root:not([data-motion="reduced"]) .constel text,:root:not([data-motion="reduced"]) .constel .star{animation:pop .5s ease-out both}
.constel .n1{animation-delay:.5s!important}.constel .n2{animation-delay:1.1s!important}.constel .n3{animation-delay:1.7s!important}.constel .n4{animation-delay:2.3s!important}
@keyframes draw{from{stroke-dashoffset:640}to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root[data-motion="reduced"] *{animation:none!important;transition:none!important}

/* session */
.sess{max-width:720px;margin:0 auto;padding:1rem 1rem 3rem;display:flex;flex-direction:column;gap:1rem}
.sh{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap}
.sh .grow{flex:1;min-width:0}
.ftimer{font:800 1.1rem Sora,sans-serif;font-variant-numeric:tabular-nums}
.qprompt{font:700 1.2rem/1.4 Sora,sans-serif}
.panel{border-radius:16px;padding:1rem 1.1rem;border:1px solid var(--line);background:var(--surface)}
.panel h3{font-family:"Atkinson Hyperlegible",sans-serif;color:var(--muted);font-size:.95rem;margin-bottom:.3rem}
.panel.ex{background:var(--surface2)}
.opts .box{font-weight:400}
.inp{width:100%;min-height:52px;padding:.7rem 1rem;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);font:700 1.2rem "Atkinson Hyperlegible",sans-serif}
.inp:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
label.lbl{display:block;font-weight:700;margin-bottom:.35rem}
.fb{border-radius:16px;padding:1rem 1.1rem;border:1.5px solid}
.fb.ok{background:var(--ok-soft);border-color:var(--ok)}
.fb.bad{background:var(--bad-soft);border-color:var(--bad)}
.fb .fbh{display:flex;align-items:center;gap:.5rem;font:800 1.2rem Sora,sans-serif}
.fb.ok .fbh{color:var(--ok)}.fb.bad .fbh{color:var(--bad)}
.fb .fbh svg{width:26px;height:26px}
.actions{display:flex;flex-direction:column;gap:.6rem}
@media (min-width:560px){.actions{flex-direction:row;flex-wrap:wrap}.actions .btn.primary{order:-1}}
.qt{display:flex;align-items:center;gap:.7rem;font-weight:700;font-variant-numeric:tabular-nums}
.qt .bar{flex:1}
details.panel summary{cursor:pointer;font-weight:700;min-height:32px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(5.2rem + env(safe-area-inset-bottom,0px));background:var(--text);color:var(--bg);padding:.7rem 1.1rem;border-radius:12px;font-weight:700;z-index:60;max-width:90%;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--text);padding:1.3rem;max-width:min(92vw,460px);width:100%}
dialog::backdrop{background:rgba(5,8,22,.6)}
dialog h2{margin-bottom:.6rem}
dialog textarea{width:100%;min-height:160px;font:.8rem monospace;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:.6rem}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.7rem 0;border-top:1px solid var(--line);min-height:56px}
.toggle:first-of-type{border-top:0}
.toggle input{width:24px;height:24px;accent-color:var(--primary);flex:none}
.field{display:flex;flex-direction:column;gap:.35rem}
.field select{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--text);padding:0 .8rem;font:700 1rem "Atkinson Hyperlegible",sans-serif}
.boot{min-height:100vh;display:grid;place-items:center;color:var(--muted);font-weight:700}
.empty{text-align:center;padding:2rem 1rem;display:flex;flex-direction:column;align-items:center;gap:.8rem}
.empty .big{font-size:2.4rem}
.resbig{font:800 2.2rem Sora,sans-serif}
/* ---- Metax v0.002 ---- */
.orb{flex:none;display:block;overflow:visible}
.orb .halo{fill:none;stroke:hsl(var(--mh) 70% 52%);stroke-width:1.6;opacity:.55;transform-box:fill-box;transform-origin:center}
.orb .ring{fill:none;stroke:hsl(var(--mh) 75% 55%);stroke-width:1.8;opacity:.85}
:root:not([data-motion="reduced"]) .orb[data-st="welcome"]{animation:orbin .7s ease-out both}
:root:not([data-motion="reduced"]) .orb[data-st="success"] .halo{animation:orbpulse .7s ease-out 1 both}
:root:not([data-motion="reduced"]) .orb[data-st="hint"] .halo{animation:orbexp .8s ease-out 1 both}
@keyframes orbin{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@keyframes orbpulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(1.22);opacity:.3}}
@keyframes orbexp{from{transform:scale(.85);opacity:.2}to{transform:scale(1.08);opacity:.75}}
.mx{display:flex;gap:1rem;align-items:flex-start}
.mx .mxb{flex:1;min-width:0;display:flex;flex-direction:column;gap:.55rem}
.mx h2{font-size:1.15rem}
.mx.ok{border-color:var(--ok);background:var(--ok-soft)}
.mx.warm{border-color:var(--amber);background:var(--amber-soft)}
.card .card.mx{box-shadow:none;background:var(--surface2)}
.optc input:disabled+.box{opacity:.55}
.optc input:disabled{cursor:not-allowed}
@media (max-width:480px){.mx{gap:.7rem}}
</style>
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>
<div id="app"><div class="boot" role="status">Preparando tu ruta…</div></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="live" class="sr" role="status" aria-live="polite" aria-atomic="true"></div>
<dialog id="dlg" aria-labelledby="dlgt"></dialog>

<script>
'use strict';
/* =====================================================================
   DATOS DEL CATÁLOGO (separados de la presentación)
   Todo el contenido es DEMO: sin validación docente ni indicador oficial
   confirmado. Para publicar contenido oficial, extraer y verificar contra
   el programa MINEDUCYT vigente y cambiar estado_de_revision.
   ===================================================================== */
const GRADES=[
 {id:'7',label:'7.º grado',short:'7.º grado'},
 {id:'8',label:'8.º grado',short:'8.º grado'},

function subjectsFor(g){
 if(!g)return[];
 const base=BASE_SUBJ[g].slice();
 if((g==='b1'||g==='b2')&&S.profile.mod2025)NEW2025.forEach(k=>base.push(k));
 return base;
}
function topicsFor(g,subject){
 const subs=subjectsFor(g);
 return TOPICS.filter(t=>t.grados.includes(g)&&subs.includes(t.subject)&&(!subject||t.subject===subject));
}
const gradeLabel=id=>(GRADES.find(g=>g.id===id)||{}).label||'';
const masteredCard=x=>!!x&&new Set(x.sessOk||[]).size>=2&&!!x.lastOk;
function topicState(t){
 const cs=t.cards.map((c,i)=>S.cards[ck(t.id,i)]);
 if(!cs.some(x=>x&&x.seen>0))return'nuevo';
 if(cs.every(masteredCard))return'dominado';
 if(cs.every(x=>x&&x.ok>0))return'practicado';
 return'practica';
}
const STATE={nuevo:{l:'Nuevo'},practica:{l:'En práctica'},practicado:{l:'Practicado'},dominado:{l:'Dominado'}};

 if(s==='practicado')x='<circle cx="11" cy="11" r="8.5" fill="currentColor"/>';
 if(s==='dominado')x='<circle cx="11" cy="11" r="8.5" fill="currentColor"/><path d="M7 11.3l3 3 5-6" fill="none" stroke="var(--bg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';

}
function topicAcc(t){
 let s=0,o=0;t.cards.forEach((c,i)=>{const x=S.cards[ck(t.id,i)];if(x){s+=x.seen;o+=x.ok}});
 return s?o/s:null;
}
function topicTs(t){return Math.max(0,...t.cards.map((c,i)=>(S.cards[ck(t.id,i)]||{}).last||0))}
function practicedCount(t){return t.cards.filter((c,i)=>(S.cards[ck(t.id,i)]||{}).ok>0).length}
function subjectStats(g,sub){
 const ts=topicsFor(g,sub),st={nuevo:0,practica:0,practicado:0,dominado:0};
 ts.forEach(t=>st[topicState(t)]++);
 return{total:ts.length,st};
}

function reviewAll(){

 return Object.entries(S.review).map(([k,v])=>{const p=k.split('#');return{key:k,tid:p[0],ci:+p[1],due:v.due,box:v.box}}).filter(x=>vis.has(x.tid)&&TOPIC[x.tid]&&TOPIC[x.tid].cards[x.ci]);
}

function reviewUpdate(key,ok){

 if(!ok){if(r)S.review[key]={box:0,due:now()+IV[0]};return}
 if(r){const nb=r.box+1;if(nb>=IV.length)delete S.review[key];else S.review[key]={box:nb,due:now()+IV[nb]}}

function minutesToday(){return((S.days[dkey()]||{}).sec||0)/60}
function touchStreak(){
 const t=dkey(),st=S.streak;
 if(st.last===t)return;
 st.cur=(st.last===ago(1))?st.cur+1:1;
 st.best=Math.max(st.best,st.cur);st.last=t;
}
const streakNow=()=>(S.streak.last===dkey()||S.streak.last===ago(1))?S.streak.cur:0;

function recommend(){
 const g=S.profile.grade,ts=topicsFor(g);
 if(!ts.length)return null;
 const goal=S.profile.goal,ready=readyReview(),lv=S.profile.level;
 if(ready.length&&(ready.length>=3||goal==='reinforce'||goal==='exam'))
  return{kind:'review',n:ready.length,reason:'Tienes '+ready.length+(ready.length===1?' concepto listo':' conceptos listos')+' para repasar, y repasar a tiempo ayuda a recordar.'};
 const prog=ts.filter(t=>topicState(t)==='practica').sort((a,b)=>topicTs(b)-topicTs(a))[0];
 if(prog)return{kind:'topic',topic:prog,reason:'Dejaste esta microlección a medias. Retomarla ahora ayuda a consolidarla.'};
 const seenCards=Object.keys(S.cards).filter(k=>S.cards[k].seen&&TOPIC[k.split('#')[0]]&&ts.includes(TOPIC[k.split('#')[0]])).length;
 if(goal==='exam'&&seenCards>=3)
  return{kind:'rafaga',reason:'Te preparas para una evaluación. Una Ráfaga mezcla preguntas y muestra qué reforzar.'};
 if(goal==='reinforce'){
  const w=ts.filter(t=>{const s=topicState(t);return s==='practicado'||s==='practica'}).sort((a,b)=>(topicAcc(a)||0)-(topicAcc(b)||0))[0];
  if(w)return{kind:'topic',topic:w,reason:'Quieres reforzar, y esta microlección todavía no está dominada.'};
 }
 let nuevos=ts.filter(t=>topicState(t)==='nuevo');
 if(nuevos.length){
  let t,reason='Es el siguiente tema nuevo de tu ruta.';
  if(goal==='explore'){
   const cover=s=>{const x=subjectStats(g,s);return x.st.nuevo/Math.max(1,x.total)};
   t=nuevos.slice().sort((a,b)=>cover(b.subject)-cover(a.subject))[0];
   reason='Quieres explorar: esta materia es la que menos has visitado.';
  }else{
   const ord=nuevos.slice().sort((a,b)=>lv==='avanzado'?b.nivel_de_dificultad-a.nivel_de_dificultad:a.nivel_de_dificultad-b.nivel_de_dificultad);
   t=(lv==='inicial'||lv==='avanzado'||lv==='intermedio')?ord[0]:nuevos[0];
   if(lv)reason='Es un tema nuevo que encaja con tu punto de partida ('+lv+').';
  }
  return{kind:'topic',topic:t,reason};
 }
 const pr=ts.filter(t=>topicState(t)!=='dominado').sort((a,b)=>(topicAcc(a)||0)-(topicAcc(b)||0))[0];
 if(pr)return{kind:'topic',topic:pr,reason:'Ya la practicaste. Otra ronda en una sesión distinta la acerca a dominada.'};
 return{kind:'rafaga',reason:'Dominaste todo lo disponible en esta demo. Una Ráfaga mezcla preguntas para mantenerlo fresco.'};
}

function topicItems(t){

function prepCard(){

 s.sel=null;s.val='';s.hint=false;s.last=null;s.cardStart=now();s.attempts=0;s.tried=[];s.triedVals=[];s.hintUsed=false;s.simDone=false;

function onTick(){
 const s=UI.sess;
 if(!s){stopTick();return}
 if(s.focusEnd){
  const left=Math.max(0,Math.round((s.focusEnd-now())/1000)),el=$('#ftimer');
  if(el)el.textContent=fmt(left);
  if(left===0&&!s.focusDone){s.focusDone=true;const n=$('#focusnote');if(n)n.hidden=false}
 }
 if(s.stage==='practice'&&s.qLeft!=null){
  s.qLeft--;
  const t=$('#qt'),b=$('#qtb');
  if(t)t.textContent='Tiempo: '+fmt(Math.max(0,s.qLeft));
  if(b)b.style.width=Math.max(0,s.qLeft/30*100)+'%';
  if(s.qLeft<=0){s.qLeft=null;submitAnswer(true)}
 }
}
function checkInput(given,accept){
 const n=x=>String(x).trim().toLowerCase().replace(/\s+/g,'').replace(/[$%]/g,'').replace(',','.').replace('−','-');
 const g=n(given);
 return accept.some(a=>{
  const m=n(a);if(m===g)return true;
  return/^-?\d+(\.\d+)?$/.test(g)&&/^-?\d+(\.\d+)?$/.test(m)&&Math.abs(parseFloat(g)-parseFloat(m))<1e-9;
 });
}
function submitAnswer(timeout){
 const s=UI.sess;if(!s||s.stage!=='practice')return;
 const it=s.items[s.i],t=TOPIC[it.tid],card=t.cards[it.ci],q=card.q,key=ck(it.tid,it.ci);
 let ok=false,given='';
 if(!timeout){
  if(q.type==='mcq'){if(s.sel==null)return;ok=s.order[s.sel]===q.a;given=q.o[s.order[s.sel]]}
  else{given=s.val;if(!String(given).trim())return;ok=checkInput(given,q.accept)}
 }
 const first=s.attempts===0,clean=first&&!s.hintUsed;
 const sec=Math.min(150,Math.round((now()-s.cardStart)/1000));
 s.cardStart=now();
 const x=S.cards[key]||(S.cards[key]={seen:0,ok:0,sessOk:[],lastOk:false,last:0});
 x.seen++;x.last=now();x.lastOk=ok;
 /* Solo cuenta como evidencia de dominio un acierto sin ayuda y a la primera. */
 if(ok){x.ok++;if(clean&&!x.sessOk.includes(s.id))x.sessOk=x.sessOk.concat(s.id).slice(-6)}
 const d=S.days[dkey()]||(S.days[dkey()]={sec:0,q:0,ok:0});
 d.sec+=sec;d.q++;if(ok)d.ok++;
 const gain=timeout?0:(first?3+(ok?7:0):(ok?5:0));
 S.xp+=gain;s.xp+=gain;s.sec+=sec;
 touchStreak();reviewUpdate(key,ok&&first);
 s.attempts++;S.lastVisit=now();s.qLeft=null;
 if(ok){
  s.results.push({tid:it.tid,ci:it.ci,ok:true,first});
  s.last={ok:true,first};
  s.stage='feedback';
  setLive(METAX.correcta.titulo+' '+(first?METAX.correcta.primera(card.t,q.e):METAX.correcta.corregida(card.t,q.e)));
 }else{
  if(!timeout){if(q.type==='mcq')s.tried.push(s.sel);else s.triedVals.push(given)}
  s.last={ok:false,given,timeout:!!timeout};
  s.stage='retry';
  setLive(METAX.incorrecta.titulo+' '+(q.h?METAX.incorrecta.pista(card.t,q.h):METAX.incorrecta.sinPista));
 }
 UI.focus='#qp';
 beep(ok);save();render();
}
function nextCard(){

function buildRafaga(sub){

function buildDiag(){

 cardPool(S.profile.grade).forEach(x=>{const s=TOPIC[x.tid].subject;(bySub[s]=bySub[s]||[]).push(x)});
 const picks=shuffle(Object.keys(bySub)).slice(0,3).map(s=>shuffle(bySub[s])[0]);

function buildFocus(rec){
 const g=S.profile.grade,items=[],seen=new Set();
 const push=t=>{if(seen.has(t.id))return;seen.add(t.id);topicItems(t).forEach(i=>items.push(i))};

 topicsFor(g).slice().sort((a,b)=>order[topicState(a)]-order[topicState(b)]).forEach(push);

}

function similarFor(it,s){
 const t=TOPIC[it.tid],used=new Set(s.items.map(x=>ck(x.tid,x.ci)));
 const same=t.cards.map((c,i)=>({tid:t.id,ci:i})).filter(x=>x.ci!==it.ci&&!used.has(ck(x.tid,x.ci)));
 const pool=same.length?same:cardPool(S.profile.grade,t.subject).filter(x=>!used.has(ck(x.tid,x.ci)));
 return pool.length?shuffle(pool)[0]:null;
}

/* ---------- Progreso ---------- */
function viewProgress(){
 const g=S.profile.grade,subs=subjectsFor(g);
 let seen=0,ok=0;Object.keys(S.cards).forEach(k=>{seen+=S.cards[k].seen;ok+=S.cards[k].ok});
 const totalMin=Math.round(Object.values(S.days).reduce((a,d)=>a+d.sec,0)/60);
 const ts=topicsFor(g),dom=ts.filter(t=>topicState(t)==='dominado').length;
 const days=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push({k:dkey(d),w:['D','L','M','M','J','V','S'][d.getDay()],m:Math.round(((S.days[dkey(d)]||{}).sec||0)/60)})}
 const mx=Math.max(S.profile.dailyMin,...days.map(x=>x.m));
 if(!seen)return hdr('Mi Progreso',navOf('progreso').sub)+'<section class="card empty"><div class="big" aria-hidden="true">📈</div><h2>Tu progreso aparecerá aquí</h2><p class="muted">Completa tu primera actividad y verás cuánto practicas y qué temas ya dominas.</p><a class="btn primary" href="#/inicio">Ir a Mi Ruta</a></section>';
 return hdr('Mi Progreso',navOf('progreso').sub)+'<div class="stack">'+
 '<div class="tiles"><div class="tile"><b>'+totalMin+'</b><span>minutos de práctica</span></div><div class="tile"><b>'+seen+'</b><span>respuestas</span></div><div class="tile"><b>'+Math.round(ok/Math.max(1,seen)*100)+'%</b><span>de aciertos</span></div><div class="tile"><b>'+dom+'/'+ts.length+'</b><span>temas dominados</span></div></div>'+
 '<section class="card"><h2 style="margin-bottom:.5rem">Practicado no es lo mismo que dominado</h2><p class="muted">«Practicado» significa que ya acertaste cada pregunta al menos una vez. «Dominado» pide acertar en dos sesiones distintas, porque recordar de nuevo otro día es la mejor evidencia de que aprendiste.</p></section>'+
 '<section class="card"><h2 style="margin-bottom:.8rem">Últimos 7 días (minutos)</h2><div class="week" role="list">'+days.map((x,i)=>'<div class="d'+(i===6?' today':'')+'" role="listitem" aria-label="'+x.w+': '+x.m+' minutos"><b>'+x.m+'</b><div class="col2" style="height:'+Math.max(3,x.m/mx*100)+'%"></div><span>'+x.w+'</span></div>').join('')+'</div></section>'+
 subs.filter(s=>topicsFor(g,s).length).map(s=>{const x=subjectStats(g,s);
  return'<section class="card"><div class="row">'+subjIcon(s)+'<div><h2>'+esc(SUBJECTS[s].name)+'</h2><p class="small muted">'+stText(x.st)+'</p></div></div><div style="margin:.8rem 0">'+stackBar(x.st,x.total)+'</div><div class="stack" style="gap:.5rem">'+topicsFor(g,s).map(topicRow).join('')+'</div></section>'}).join('')+'</div>';
}

/* ---------- Sesión ---------- */
function viewSession(){
 const s=UI.sess,it=s.items[s.i],t=TOPIC[it.tid],card=t.cards[it.ci],q=card.q,key=ck(it.tid,it.ci);
 const labels={topic:t.topic,rafaga:'Ráfaga',enfoque:'Enfoque',review:'Zona de Repaso',diag:'Mini-test'};
 const unitWord=s.mode==='topic'?'Tarjeta':'Pregunta';
 const head='<div class="sh">'+orb({state:'idle',subject:t.subject,size:36})+'<div class="grow"><strong>'+esc(labels[s.mode])+'</strong><p class="small muted">'+esc(SUBJECTS[t.subject].name)+' · '+esc(gradeLabel(S.profile.grade))+' '+(s.mode==='topic'?demoBadge:'')+'</p></div>'+
  (s.focusEnd?'<span class="ftimer" id="ftimer" role="timer" aria-label="Tiempo restante">'+fmt(Math.max(0,Math.round((s.focusEnd-now())/1000)))+'</span>':'')+
  '<button class="btn sm" data-act="exit">Terminar sesión</button></div>'+
  '<div><div class="bar" aria-hidden="true"><i style="width:'+((s.i+(s.stage==='feedback'?1:0))/s.items.length*100)+'%"></i></div><p class="small muted" style="margin-top:.3rem">'+unitWord+' '+(s.i+1)+' de '+s.items.length+'</p></div>'+
  '<p id="focusnote" class="banner" role="status"'+(s.focusDone?'':' hidden')+'>Tu bloque terminó. Termina esta tarjeta y haremos el cierre.</p>';
 const qbox='<p id="qp" class="qprompt" tabindex="-1">'+esc(q.p)+'</p>';
 const saveBtn=S.review[key]?'<span class="small muted">Guardada en tu Zona de Repaso.</span>':'<button class="btn" data-act="save-review" data-key="'+key+'">'+METAX.incorrecta.repaso+'</button>';
 const corr=q.type==='mcq'?q.o[q.a]:q.accept[0];
 let body='';
 if(s.stage==='learn'){
  body='<h1 id="cardh" tabindex="-1" style="font-size:1.4rem">'+esc(card.t)+'</h1>'+
  '<div class="panel"><h3>Idea clave</h3><p>'+esc(card.idea)+'</p></div><div class="panel ex"><h3>Ejemplo</h3><p>'+esc(card.ejemplo)+'</p></div>'+
  '<div class="actions"><button class="btn primary lg" data-act="to-practice">Practicar</button></div>';
 }else if(s.stage==='practice'){
  let inputs='';
  if(q.type==='mcq'){
   inputs='<fieldset class="opts" style="border:0;padding:0;margin:0" aria-labelledby="qp"><legend class="sr">Opciones de respuesta</legend>'+s.order.map((oi,di)=>{const used=s.tried.includes(di);
    return'<label class="optc"><input type="radio" name="o" value="'+di+'" data-bind="sel"'+(s.sel===di?' checked':'')+(used?' disabled':'')+'><span class="box"><span class="k">'+String.fromCharCode(65+di)+'</span><span>'+esc(q.o[oi])+(used?' <em class="small muted">(ya la probaste)</em>':'')+'</span></span></label>'}).join('')+'</fieldset>';
  }else{
   inputs='<div><label class="lbl" for="ans">Tu respuesta</label><input class="inp" id="ans" type="text" inputmode="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" data-bind="val" value="'+esc(s.val)+'">'+
   (s.triedVals.length?'<p class="small muted" style="margin-top:.4rem">Ya probaste: '+s.triedVals.map(esc).join(', ')+'</p>':'')+'</div>';
  }
  const can=q.type==='mcq'?s.sel!=null:String(s.val).trim().length>0;
  const hintPanel=!s.hint?'':(q.h?mx({state:'hint',subject:t.subject,size:48,title:METAX.pista.titulo,body:METAX.pista.texto(card.t,q.h)}):
   mx({state:'hint',subject:t.subject,size:48,title:METAX.pista.titulo,body:METAX.incorrecta.sinPista,actions:'<button class="btn sm" data-act="show-expl">'+METAX.incorrecta.secundaria+'</button>'+saveBtn}));
  body=(s.qLeft!=null?'<div class="qt"><span id="qt">Tiempo: '+fmt(Math.max(0,s.qLeft))+'</span><div class="bar" aria-hidden="true"><i id="qtb" style="width:'+Math.max(0,s.qLeft/30*100)+'%"></i></div><button class="btn sm" data-act="more-time">+15 s</button></div>':'')+
  qbox+inputs+hintPanel+
  (s.mode!=='topic'?'<details class="panel"><summary>Ver idea clave</summary><p style="margin-top:.5rem">'+esc(card.idea)+'</p></details>':'')+
  '<div class="actions"><button class="btn primary lg" id="sub" data-act="submit"'+(can?'':' disabled')+'>Comprobar</button>'+(s.hint?'':'<button class="btn" data-act="hint">'+METAX.pista.pedir+'</button>')+'</div>';
 }else if(s.stage==='retry'){
  let extra='';
  if(s.last&&s.last.timeout)extra+='<p class="small">'+METAX.incorrecta.tiempo+'</p>';
  if(s.attempts>=2)extra+='<p>'+esc(METAX.incorrecta.repetido)+'</p><div class="panel ex"><h3>Ejemplo</h3><p>'+esc(card.ejemplo)+'</p></div>';
  body=qbox+mx({state:'hint',tone:'warm',subject:t.subject,title:METAX.incorrecta.titulo,body:q.h?METAX.incorrecta.pista(card.t,q.h):METAX.incorrecta.sinPista,extra,
   actions:'<button class="btn primary lg" data-act="retry-again">'+METAX.incorrecta.primaria+'</button><button class="btn" data-act="show-expl">'+METAX.incorrecta.secundaria+'</button>'+saveBtn});
 }else{
  const L=s.last,sim=(!L.ok&&!s.simDone)?similarFor(it,s):null;
  const panel=L.ok?
   mx({state:'success',tone:'ok',subject:t.subject,title:METAX.correcta.titulo,body:L.first?METAX.correcta.primera(card.t,q.e):METAX.correcta.corregida(card.t,q.e)}):
   mx({state:'idle',subject:t.subject,title:'Explicación',html:true,body:'La respuesta correcta es <strong>'+esc(corr)+'</strong>. '+esc(q.e)+(sim?' '+METAX.incorrecta.parecida:'')});
  body=qbox+panel+'<div class="actions"><button class="btn primary lg" data-act="next">'+(s.i>=s.items.length-1&&!sim?'Ver resultado':'Continuar')+'</button>'+
   (sim?'<button class="btn" data-act="similar">Probar una pregunta parecida</button>':'')+
   (s.mode==='topic'?'<button class="btn" data-act="reread">Leer la explicación otra vez</button>':'')+
   (L.ok?'':saveBtn)+'</div>';
 }
 return'<div class="sess" id="main" tabindex="-1">'+(!navigator.onLine?'<div class="banner" role="status">Sin conexión. Tu avance se guarda en este dispositivo.</div>':'')+head+body+'</div>';
}

/* ---------- Resultado ---------- */
function viewResult(){
 const r=UI.result,pct=r.total?Math.round(r.ok/r.total*100):0,min=Math.max(1,Math.round(r.sec/60));
 const unsaved=r.results.filter(x=>!x.ok&&!S.review[ck(x.tid,x.ci)]);
 const titles={topic:METAX.completada.titulo,rafaga:'Ráfaga completada.',enfoque:'Bloque de enfoque completado.',review:'Repaso completado.',diag:'Mini-test completado.'};
 const saveWrong=unsaved.length?'<button class="btn" data-act="save-wrong">Guardar '+(unsaved.length===1?'la que fallé':'las '+unsaved.length+' que fallé')+' para repasar</button>':'';
 let panel='',extra='',cta='',sec='';
 if(r.mode==='diag'){
  extra='<p>Tu punto de partida: <strong>'+levelLabel()+'</strong>. No es una nota: solo ajusta el orden de tus recomendaciones y puedes repetirlo cuando quieras.</p>';
  cta=r.wasOnboarding?'<button class="btn primary lg" data-act="ob-diagdone">Continuar</button>':'<a class="btn primary lg" href="#/inicio">Ir a Mi Ruta</a>';
 }else{
  const rec=recommend();
  if(r.mode==='topic'&&r.tid){
   const t=TOPIC[r.tid],st=topicState(t),seguro=t.cards.some((c,i)=>masteredCard(S.cards[ck(t.id,i)]));
   panel=mx({state:'success',tone:'ok',subject:t.subject,body:METAX.completada.mensaje(t.topic)+(seguro?' '+METAX.completada.segura:'')});
   extra='<p class="row">'+stIcon(st)+' Estado del tema: <strong>'+STATE[st].l+'</strong> '+demoBadge+'</p><p class="muted small">Completar las tarjetas no significa dominar el tema. Para marcarlo como dominado necesitas acertar cada pregunta, sin ayuda y a la primera, en dos sesiones distintas. El contenido es de demostración y no está validado como material oficial.</p>';
   if(rec&&rec.kind==='topic'&&rec.topic.id!==r.tid){
    cta='<button class="btn primary lg" data-act="start-topic" data-id="'+rec.topic.id+'">'+METAX.completada.primaria+'</button>';
    extra+='<p class="small muted">Tu ruta continúa con «'+esc(rec.topic.topic)+'».</p>';
   }else if(rec&&rec.kind==='review')cta='<button class="btn primary lg" data-act="start-review">'+METAX.completada.primaria+'</button>';
   else cta='<a class="btn primary lg" href="#/inicio">'+METAX.completada.primaria+'</a>';
   sec='<div class="actions"><button class="btn" data-act="start-topic" data-id="'+t.id+'" data-all="1">'+METAX.completada.secundaria+'</button>'+saveWrong+'</div>';
  }else{
   if(r.mode==='enfoque')extra+='<p>Hiciste un bloque de '+r.focusMin+' minutos. Antes de seguir, levántate, toma agua y descansa la vista unos minutos.</p>';
   cta='<a class="btn primary lg" href="#/inicio">Volver a Mi Ruta</a>';
   sec='<div class="actions">'+saveWrong+(reviewAll().length?'<a class="btn" href="#/repaso">Ir a Zona de Repaso</a>':'')+'<a class="btn" href="#/progreso">Ver mi progreso</a></div>';
  }
  if(S.profile.dailyMin===5&&minutesToday()>=5)extra+='<p>'+METAX.corta+'</p>';
  if(r.early)extra+='<p class="muted">'+METAX.pausa+'</p>';
 }
 return'<div class="sess" id="main" tabindex="-1"><section class="card stack"><h1 tabindex="-1" style="font-size:1.5rem">'+titles[r.mode]+'</h1>'+
 '<p class="resbig">'+r.ok+' de '+r.total+' <span class="muted" style="font:400 1rem sans-serif">respuestas correctas ('+pct+'%)</span></p>'+
 '<p class="muted">'+min+(min===1?' minuto':' minutos')+' de práctica'+(S.prefs.gamif&&r.xp?' · +'+r.xp+' XP por practicar':'')+'</p>'+panel+extra+'<div class="actions">'+cta+'</div>'+sec+'</section></div>';
}

 }else if(st===4){
  inner=back+prog+'<h1 tabindex="-1">¿Cuánto tiempo quieres dedicar hoy?</h1><fieldset class="opts" style="border:0;padding:0;margin:0"><legend class="sr">Meta diaria</legend>'+
  [[5,'5 min','Un primer impulso'],[15,'15 min','Un buen tramo'],[30,'30 min','Sesión profunda']].map(x=>opt('dm',x[0],x[1],x[2],p.dailyMin===x[0],'obdaily')).join('')+'</fieldset><p class="small muted">Puedes cambiar esta meta cuando quieras.</p>'+
  '<button class="btn primary lg" data-act="ob-next">Continuar</button><button class="link" data-act="ob-skip" style="align-self:flex-start">Omitir este paso</button>';
 }else{
  inner='<div class="stack" style="gap:.7rem"><h1 tabindex="-1">Ruta lista.</h1><p class="muted" style="font-size:1.1rem">Empieza con una microdosis y avanza una tarjeta a la vez.</p></div>'+
  '<div class="field"><label class="lbl" for="obname">¿Cómo quieres que te llamemos? (opcional)</label><input class="inp" id="obname" maxlength="24" autocomplete="off" placeholder="Tu nombre o apodo" value="'+esc(p.name)+'"></div>'+
  '<button class="btn primary lg" data-act="ob-finish">Ir a Mi Ruta</button>';
 }
 return'<div class="ob"><main id="main" class="obc" tabindex="-1" style="padding:0">'+inner+'</main></div>';
}

function viewError(err){
 return'<div class="ob"><main id="main" class="obc" tabindex="-1" style="padding:0"><h1 tabindex="-1">Algo no salió como esperábamos</h1><p class="muted">No es culpa tuya y tu avance sigue guardado. Intenta volver a Mi Ruta; si el problema continúa, recarga la página.</p><a class="btn primary lg" href="#/inicio" data-act="retry">Volver a Mi Ruta</a></main></div>';
}

/* =====================================================================
   RENDER Y RUTAS
   ===================================================================== */
function route(){
 const h=location.hash.replace(/^#\/?/,'').split('/');
 return{name:h[0]||'inicio',arg:h[1]};
}
function applyPrefs(){
 const r=document.documentElement;
 if(S.prefs.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.prefs.theme);
 if(S.prefs.reduceMotion)r.setAttribute('data-motion','reduced');else r.removeAttribute('data-motion');
}
const VIEWS={inicio:viewHome,explorar:viewExplore,tema:viewTopic,repaso:viewReview,desafios:viewChallenges,enfoque:viewFocusSetup,progreso:viewProgress,perfil:viewProfile};
const ACTIVE={tema:'explorar',enfoque:'desafios'};
function render(){
 applyPrefs();
 const app=$('#app');if(!app)return;
 const r=route();
 let html='';
 try{
  if(r.name==='practicar'){
   if(!UI.sess){location.hash='#/inicio';return}
   html=viewSession();
  }else if(r.name==='resultado'){
   if(!UI.result){location.hash='#/inicio';return}
   html=viewResult();
  }else if(!S.profile.onboarded){
   html=viewOnboarding();
  }else{
   const v=VIEWS[r.name]||viewHome,act=ACTIVE[r.name]||(VIEWS[r.name]?r.name:'inicio');
   html=shell(v(r.arg),act);
  }
 }catch(err){console.error(err);html=viewError(err)}
 app.innerHTML=html;
 const n=navOf(r.name);
 document.title=(n?n.label+' · ':'')+'AI Metax';
 const f=UI.focus&&$(UI.focus);
 UI.focus=null;
 const target=f||$('main h1')||$('#main h1')||$('#main');
 if(target&&target.focus)target.focus({preventScroll:true});
}
let lastRoute='';
window.addEventListener('hashchange',()=>{
 const r=route().name;
 if(r!=='practicar'&&UI.sess){stopTick();UI.sess=null}
 if(r!==lastRoute){window.scrollTo(0,0);lastRoute=r}
 render();
});
window.addEventListener('online',render);
window.addEventListener('offline',render);

/* =====================================================================
   INTERACCIÓN
   ===================================================================== */
let toastT=null;
function toast(m){const t=$('#toast');if(!t)return;t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2800)}
function openDlg(html){const d=$('#dlg');d.innerHTML=html;if(d.showModal)d.showModal();else d.setAttribute('open','')}
function closeDlg(){const d=$('#dlg');if(!d)return;if(d.close)d.close();else d.removeAttribute('open')}

const ACT={
 'ob-next'(){S.profile.onboardStep++;save();render()},
 'ob-back'(){S.profile.onboardStep=Math.max(0,S.profile.onboardStep-1);save();render()},
 'ob-skip'(){
  const p=S.profile;
  if(p.onboardStep===2&&!p.goal)p.goal='explore';
  p.onboardStep++;save();render();
 },
 'ob-motion'(){S.prefs.reduceMotion=!S.prefs.reduceMotion;save();render()},
 'ob-diag'(){startSession('diag',buildDiag())},
 'ob-diagdone'(){S.profile.onboardStep=4;UI.result=null;save();location.hash='#/inicio';render()},
 'ob-finish'(){
  const n=$('#obname');if(n)S.profile.name=n.value.trim();
  if(!S.profile.goal)S.profile.goal='explore';
  S.profile.onboarded=true;S.profile.onboardStep=0;S.lastVisit=now();save();
  if(location.hash==='#/inicio'||location.hash==='')render();else location.hash='#/inicio';
 },
 'start-topic'(d){const t=TOPIC[d.id];if(!t)return;startSession('topic',d.all?t.cards.map((c,i)=>({tid:t.id,ci:i})):topicItems(t),{tid:t.id})},
 'start-review'(){startSession('review',readyReview().map(x=>({tid:x.tid,ci:x.ci})))},
 'start-review-early'(){startSession('review',reviewAll().sort((a,b)=>a.due-b.due).slice(0,5).map(x=>({tid:x.tid,ci:x.ci})))},
 rafaga(){const el=$('#rsub');startSession('rafaga',buildRafaga(el&&el.value?el.value:null))},
 diag(){startSession('diag',buildDiag())},
 'focus-start'(){
  const c=document.querySelector('input[name="foc"]:checked'),m=c?+c.value:15;
  startSession('enfoque',buildFocus(recommend()),{focusEnd:now()+m*60000,focusMin:m});
 },
 'to-practice'(){const s=UI.sess;s.stage='practice';s.cardStart=now();UI.focus='#qp';render()},
 reread(){const s=UI.sess;s.stage='learn';UI.focus='#cardh';render()},
 hint(){const s=UI.sess,t=TOPIC[s.items[s.i].tid],c=t.cards[s.items[s.i].ci];s.hint=true;s.hintUsed=true;UI.focus='#qp';setLive(c.q.h?METAX.pista.texto(c.t,c.q.h):METAX.incorrecta.sinPista);render()},
 'more-time'(){const s=UI.sess;if(s.qLeft!=null){s.qLeft=Math.min(60,s.qLeft+15);const t=$('#qt');if(t)t.textContent='Tiempo: '+fmt(s.qLeft)}},
 submit(){submitAnswer(false)},
 next(){nextCard()},
 exit(){const s=UI.sess;if(!s)return;if(s.stage==='retry'||(s.stage==='practice'&&s.attempts>0)){const it=s.items[s.i];s.results.push({tid:it.tid,ci:it.ci,ok:false})}if(s.results.length)finishSession(s.i<s.items.length-1);else{stopTick();UI.sess=null;location.hash='#/inicio'}},
 'save-review'(d){S.review[d.key]={box:0,due:now()+IV[0]};save();if(UI.sess)UI.focus='#qp';toast('Guardado en tu Zona de Repaso');render()},
 energy(d){S.energy={date:dkey(),v:d.v};save();render()},
 'route-subj'(d){UI.routeSubject=d.v;render()},
 filter(d){UI.filter=d.v;render()},
 'show-data'(){openDlg('<h2 id="dlgt">Tus datos</h2><p class="small muted" style="margin-bottom:.6rem">Esto es todo lo que se guarda en este dispositivo.</p><textarea id="dd" readonly aria-label="Tus datos en formato JSON">'+esc(JSON.stringify(S,null,1))+'</textarea><div class="row" style="margin-top:.8rem"><button class="btn primary sm" data-act="copy-data">Copiar</button><button class="btn sm" data-act="dlg-close">Cerrar</button></div>')},
 'copy-data'(){const t=$('#dd');if(!t)return;t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Copiado'),()=>{document.execCommand('copy');toast('Copiado')})}catch(e){try{document.execCommand('copy');toast('Copiado')}catch(e2){toast('Selecciona el texto y cópialo manualmente')}}},
 'reset-ask'(){openDlg('<h2 id="dlgt">¿Borrar todos tus datos?</h2><p class="muted" style="margin-bottom:1rem">Se eliminarán tu perfil, tu progreso y tus preferencias de este dispositivo. No se puede deshacer.</p><div class="row"><button class="btn sm" data-act="dlg-close">Cancelar</button><button class="btn primary sm" data-act="reset-do">Sí, borrar</button></div>')},
 'reset-do'(){try{localStorage.removeItem(KEY)}catch(e){}S=defaults();UI.sess=null;UI.result=null;UI.welcomeOpen=false;UI.welcomeDone=false;closeDlg();location.hash='#/';render();toast('Datos borrados')},
 'dlg-close'(){closeDlg()},
 retry(){render()},
 resume(){
  UI.welcomeOpen=false;UI.welcomeDone=true;
  const r=recommend();
  if(!r){location.hash='#/explorar';return}
  if(r.kind==='topic')ACT['start-topic']({id:r.topic.id});else if(r.kind==='review')ACT['start-review']();else ACT.rafaga({});
 },
 'welcome-explore'(){UI.welcomeOpen=false;UI.welcomeDone=true;location.hash='#/explorar'},
 'retry-again'(){const s=UI.sess;s.stage='practice';s.sel=null;s.val='';s.cardStart=now();UI.focus=curQ().type==='input'?'#ans':'#qp';render()},
 'show-expl'(){
  const s=UI.sess;if(!s||(s.stage!=='retry'&&s.stage!=='practice'))return;
  const it=s.items[s.i],q=curQ(),corr=q.type==='mcq'?q.o[q.a]:q.accept[0];
  s.results.push({tid:it.tid,ci:it.ci,ok:false});
  s.last={ok:false,given:(s.last&&s.last.given)||'',viewed:true};
  s.stage='feedback';UI.focus='#qp';
  setLive('Explicación de Metax. La respuesta correcta es '+corr+'. '+q.e);
  render();
 },
 similar(){
  const s=UI.sess,it=s.items[s.i],c=similarFor(it,s);
  if(c){s.items.splice(s.i+1,0,c);s.simDone=true;nextCard()}
 },
 'save-wrong'(){
  UI.result.results.filter(x=>!x.ok).forEach(x=>{const k=ck(x.tid,x.ci);if(!S.review[k])S.review[k]={box:0,due:now()+IV[0]}});
  save();toast('Guardado en tu Zona de Repaso');render();
 },
 pause(){toast(METAX.pausa);UI.result=null;location.hash='#/inicio'}

};
document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');
 if(!el)return;
 const a=ACT[el.dataset.act];
 if(a){if(el.tagName==='BUTTON'||el.dataset.act!=='retry')a(el.dataset,el)}
});
const BIND={
 obgrade(el){S.profile.grade=el.value;save();const b=$('#obnext');if(b)b.disabled=false},
 obgoal(el){S.profile.goal=el.value;save();const b=$('#obnext');if(b)b.disabled=false},
 obdaily(el){S.profile.dailyMin=+el.value;save()},
 daily(el){S.profile.dailyMin=+el.value;save();render()},
 sel(el){const s=UI.sess;if(!s)return;s.sel=+el.value;const b=$('#sub');if(b)b.disabled=false},
 name(el){S.profile.name=el.value.trim();save();toast('Nombre actualizado')},
 grade(el){S.profile.grade=el.value;save();UI.filter='todos';UI.routeSubject=null;toast('Catálogo actualizado a '+gradeLabel(el.value));render()},
 goal(el){S.profile.goal=el.value;save();toast('Objetivo actualizado')},
 mod2025(el){S.profile.mod2025=el.checked;save();toast(el.checked?'Asignaturas de 2025 activadas':'Asignaturas de 2025 ocultas')},
 theme(el){S.prefs.theme=el.value;save();render()},
 reduceMotion(el){S.prefs.reduceMotion=el.checked;save();render()},
 sound(el){S.prefs.sound=el.checked;save();if(el.checked)beep(true)},
 timer(el){S.prefs.timer=el.checked;save()},
 gamif(el){S.prefs.gamif=el.checked;save()},
 energy(el){S.prefs.energy=el.checked;save()},
 orb(el){S.prefs.orb=el.checked;save();render()}
};
document.addEventListener('change',e=>{const el=e.target,b=el.dataset&&el.dataset.bind;if(b&&BIND[b]&&b!=='val')BIND[b](el)});
document.addEventListener('input',e=>{
 const el=e.target;
 if(el.dataset&&el.dataset.bind==='val'&&UI.sess){UI.sess.val=el.value;const b=$('#sub');if(b)b.disabled=!el.value.trim()}
});
document.addEventListener('keydown',e=>{
 const s=UI.sess;
 if(e.key==='Enter'&&e.target&&e.target.id==='ans'){e.preventDefault();submitAnswer(false);return}
 if(s&&s.stage==='practice'&&curQ().type==='mcq'&&/^[1-4]$/.test(e.key)&&!(e.target&&/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&e.target.type!=='radio')){
  const i=+e.key-1,r=document.querySelector('input[name="o"][value="'+i+'"]');
  if(r&&!r.disabled){r.checked=true;s.sel=i;const b=$('#sub');if(b)b.disabled=false;r.focus()}
 }
});

/* arranque */
lastRoute=route().name;
render();
</script>
</body>
</html>
