L3({id:'bio-gen',ciclos:['em'],subject:'bio',unit:'Unidad 2 · Genética y herencia',temario:null,title:'Herencia mendeliana y cuadros de Punnett',skill:'Predecir proporciones de descendencia en un cruce simple',diff:2,min:10,
 teoria:['Cada rasgo depende de pares de alelos. El genotipo es la combinación de alelos (AA, Aa, aa) y el fenotipo es el rasgo que se observa. El alelo dominante (A) se expresa si está presente; el recesivo (a), solo con dos copias.','El cuadro de Punnett organiza los gametos de cada progenitor y muestra las combinaciones posibles de la descendencia con igual probabilidad.','En un cruce Aa × Aa salen AA, Aa, Aa y aa: 1 : 2 : 1 en genotipos y 3 : 1 en fenotipos.'],
 historia:'Gregor Mendel (1822–1884), monje y naturalista, cruzó guisantes durante años y publicó sus resultados en 1866. Su trabajo pasó casi inadvertido hasta 1900, cuando varios científicos lo redescubrieron. El cuadro que lleva el nombre de Reginald Punnett se popularizó a comienzos del siglo XX.',
 personajes:[{n:'Gregor Mendel',d:'Monje y naturalista austríaco (1822–1884), considerado el fundador de la genética.'},{n:'Reginald Punnett',d:'Genetista británico (1875–1967) cuyo nombre lleva el cuadro de cruces.'}],
 formulas:['Aa × Aa → 1 AA : 2 Aa : 1 aa','Fenotipo dominante: 3/4 = 75 %; recesivo: 1/4 = 25 %','Probabilidad = casos favorables ÷ casos posibles'],
 ejemplos:[{t:'Cruce Aa × Aa',pasos:['Gametos de cada progenitor: A y a.','Cuadro 2 × 2: AA, Aa, Aa, aa.','Probabilidad de aa = 1 de 4 = 25 %.','Fenotipo dominante: 3 de 4 = 75 %.']},
  {t:'Cruce Aa × aa',pasos:['Gametos: A, a por un lado; a, a por el otro.','Combinaciones: Aa, Aa, aa, aa.','Resultado: 50 % Aa y 50 % aa.']}],
 sim:'punnett',
 cards:[
  C('Alelos y cuadros de Punnett','El dominante se expresa si está presente; el recesivo, solo con dos copias.','Aa × Aa produce AA, Aa, Aa y aa.',inp('En un cruce Aa × Aa, ¿qué porcentaje de la descendencia es aa?',['25','25%'],'Hay 1 cuadro aa de 4 posibles: 25 %.','Dibuja el cuadro de 2 × 2.')),
  C('Bases del ADN','El ADN usa cuatro bases que se emparejan siempre igual: A con T y C con G.','Si una hebra dice A-C-G-T, la complementaria es T-G-C-A.',mcq('¿Cuál es la base complementaria de la guanina (G) en el ADN?',['Adenina','Timina','Citosina','Uracilo'],2,'La guanina siempre se empareja con la citosina.','Cada base tiene una pareja fija.')),
  C('Otro cruce','Con un progenitor homocigoto recesivo cambian las proporciones.','Aa × aa: la mitad tiene el rasgo recesivo.',inp('En un cruce Aa × aa, ¿qué porcentaje de la descendencia es Aa?',['50','50%'],'Salen Aa, Aa, aa, aa: 2 de 4 = 50 %.','Escribe los cuatro cuadros.'))]}),
L3({id:'bio-eco',ciclos:['em'],subject:'bio',unit:'Unidad 4 · Ecología y ambiente',temario:null,title:'Cadenas tróficas y flujo de energía',skill:'Interpretar cadenas tróficas y la regla del 10 %',diff:2,min:9,
 teoria:['En una cadena trófica la energía pasa de los productores (fabrican su alimento con luz solar) a los consumidores y, al final, a los descomponedores, que reciclan la materia de restos y desechos.','En cada paso solo una pequeña parte de la energía llega al siguiente nivel; el resto se usa en funciones vitales o se pierde como calor. Como regla aproximada se habla de un 10 %.','Por eso las cadenas son cortas y hay muchos más productores que depredadores finales.'],
 historia:'Charles Elton describió las cadenas alimentarias y las pirámides ecológicas en 1927. En 1942 Raymond Lindeman formuló la dinámica trófica de los ecosistemas, y de ahí proviene la idea de que la energía se reduce de un nivel a otro.',
 personajes:[{n:'Charles Elton',d:'Ecólogo británico (1900–1991) que describió las cadenas alimentarias y las pirámides ecológicas.'},{n:'Raymond Lindeman',d:'Ecólogo estadounidense (1915–1942) que estudió el flujo de energía en los ecosistemas.'}],
 formulas:['Energía del nivel siguiente ≈ 10 % del nivel anterior','E₂ = E₁ × 0,10'],
 ejemplos:[{t:'Cadena de un maizal',pasos:['Maíz (productor) → ratón (consumidor primario) → lechuza (consumidor secundario).','Si el maíz almacena 1000 kcal, el ratón recibe ≈ 100 kcal.','La lechuza recibe ≈ 10 kcal.']},
  {t:'Pasto, saltamontes y rana',pasos:['Pasto: 5000 kcal.','Saltamontes: 5000 × 0,10 = 500 kcal.','Rana: 500 × 0,10 = 50 kcal.']}],
 sim:'trofica',
 cards:[
  C('Productores y consumidores','Los productores fabrican su propio alimento.','Pasto → saltamontes → rana → culebra.',mcq('En la cadena «maíz → ratón → lechuza», ¿cuál es el productor?',['Ratón','Lechuza','Maíz','Ninguno'],2,'El maíz es una planta: produce su propio alimento con la luz del sol.','El productor es el primer eslabón.')),
  C('Regla del 10 %','Cada nivel recibe aproximadamente la décima parte de la energía del anterior.','De 1000 kcal quedan unas 100 kcal.',inp('Si los productores almacenan 5000 kcal, ¿cuántas kcal llegan aproximadamente a los consumidores primarios (regla del 10 %)?',['500'],'5000 × 0,10 = 500 kcal.','Multiplica por 0,10.')),
  C('Descomponedores','Los descomponedores devuelven nutrientes al suelo.','Hongos y bacterias descomponen hojas caídas.',mcq('Los descomponedores…',['reciclan la materia de restos y desechos','fabrican su alimento con luz','solo comen animales vivos','no participan en la cadena'],0,'Descomponen restos y devuelven nutrientes al ecosistema.','Piensa en lo que ocurre con las hojas caídas.'))]}),
/* ================= CIENCIA Y TECNOLOGÍA (tc) ================= */
L3({id:'cyt-mc',ciclos:['tc'],subject:'cyt',unit:'Unidad 1 · Indagación científica',temario:null,title:'El método científico',skill:'Distinguir pregunta, hipótesis, observación y conclusión',diff:1,min:8,
 teoria:['El método científico parte de una pregunta, propone una hipótesis (una respuesta posible que se puede poner a prueba), la comprueba con observaciones o experimentos y comunica una conclusión.','En un experimento justo se cambia una sola variable a propósito (variable independiente), se mide el resultado (variable dependiente) y se mantiene igual todo lo demás.','Una conclusión puede apoyar o no la hipótesis; en ambos casos se aprende algo.'],
 historia:'Ibn al-Haytham, sabio del siglo XI, defendió comprobar las ideas con experimentos en su «Libro de óptica». En 1620 Francis Bacon publicó el «Novum Organum», que insistía en observar y experimentar, y Galileo aplicó esa mirada al estudiar el movimiento y el cielo.',
 personajes:[{n:'Ibn al-Haytham',d:'Sabio nacido en Basora (c. 965–1040) que defendió la experimentación en su estudio de la luz.'},{n:'Francis Bacon',d:'Filósofo inglés (1561–1626) que impulsó el método basado en observación y experimentos.'}],
 ejemplos:[{t:'¿Crecen mejor las plantas con luz?',pasos:['Pregunta: ¿las plantas crecen más con luz solar directa?','Hipótesis: si una planta recibe más luz, entonces crecerá más.','Experimento: dos plantas iguales, una con luz y otra en sombra; mismo suelo y misma agua.','Observación: tras dos semanas, 12 cm con luz y 7 cm en sombra.','Conclusión: los datos apoyan la hipótesis.']}],
 clasif:{titulo:'Laboratorio: ¿qué parte del método es?',ayuda:'Clasifica cada enunciado. Puedes cambiar tu respuesta.',cats:['Pregunta','Hipótesis','Observación','Conclusión'],items:[
  {t:'¿Las plantas crecen más con luz solar directa?',cat:'Pregunta',why:'Es lo que se quiere averiguar.'},
  {t:'Si una planta recibe más luz, entonces crecerá más.',cat:'Hipótesis',why:'Es una respuesta posible que se puede poner a prueba.'},
  {t:'Después de dos semanas, la planta con luz midió 12 cm y la de sombra, 7 cm.',cat:'Observación',why:'Describe datos medidos.'},
  {t:'Los datos apoyan la hipótesis: la luz favoreció el crecimiento.',cat:'Conclusión',why:'Interpreta los datos frente a la hipótesis.'},
  {t:'¿Qué efecto tiene el abono en el color de las hojas?',cat:'Pregunta',why:'Plantea algo que se quiere investigar.'},
  {t:'Las hojas de la planta con abono se ven más verdes.',cat:'Observación',why:'Es lo que se observó, sin explicarlo todavía.'}]},
 cards:[
  C('Hipótesis','Una hipótesis es una respuesta tentativa que se puede comprobar.','Pregunta: ¿las plantas crecen mejor con luz? Hipótesis: sí.',mcq('¿Qué es una hipótesis?',['Una respuesta tentativa que se puede comprobar','Un dato ya demostrado','Una opinión que no se puede probar','El resultado final'],0,'Es una explicación posible que se somete a prueba.','Una hipótesis puede ponerse a prueba.')),
  C('Variables','La variable independiente es la que el investigador cambia a propósito.','Luz o sombra en el experimento de las plantas.',mcq('¿Qué es la variable independiente?',['La que el investigador cambia a propósito','La que se mide como resultado','La que se mantiene igual','Una conclusión'],0,'Es el factor que se modifica para ver su efecto.','Piensa en lo que decides cambiar.')),
  C('Experimento justo','Solo debe cambiar una variable; lo demás se mantiene igual.','Dos plantas con el mismo suelo y la misma agua.',mcq('En un experimento con dos plantas (luz y sombra), ¿qué debe mantenerse igual?',['La cantidad de agua y el tipo de suelo','La cantidad de luz','La altura final','La conclusión'],0,'Así el único cambio es la luz.','Todo debe ser igual, excepto lo que estudias.'))]}),
/* ================= LENGUAJE Y LITERATURA ================= */
L3({id:'lyl-tc-ip',ciclos:['tc'],subject:'lyl',unit:'Unidad 1 · Comprensión Lectora y Expresión Escrita',temario:null,title:'Idea principal e ideas secundarias',skill:'Distinguir la idea principal de las secundarias',diff:1,min:8,
 teoria:['La idea principal es lo más importante que dice un texto o un párrafo; responde a «¿de qué trata y qué dice sobre eso?». Las ideas secundarias la explican, la ejemplifican o la apoyan.','Para encontrarla: lee todo el texto, subraya lo que se repite, pregúntate qué quiere comunicar el autor y comprueba que las demás ideas giren en torno a ella.','Una buena idea principal se puede decir en una sola oración con tus propias palabras.'],
 historia:'Desde la Antigüedad, los maestros de retórica enseñaban a identificar el tema central de un discurso. En la Edad Media, los copistas anotaban «glosas» al margen de los manuscritos para destacar y aclarar lo esencial de cada pasaje.',
 ejemplos:[{t:'Párrafo sobre el reciclaje',pasos:['Texto: «Reciclar reduce la basura. El vidrio y el papel pueden reciclarse varias veces. Separar los residuos en casa facilita el proceso».','Pregunta: ¿de qué trata y qué dice sobre eso? Trata del reciclaje y dice que reduce la basura.','Idea principal: «Reciclar reduce la basura».','Las otras dos oraciones dan ejemplos y explican cómo hacerlo: son secundarias.']}],
 clasif:{titulo:'Laboratorio: principal o secundaria',ayuda:'Párrafo sobre el reciclaje. Clasifica cada oración.',cats:['Idea principal','Idea secundaria'],items:[
  {t:'Reciclar reduce la cantidad de basura que llega a los vertederos.',cat:'Idea principal',why:'Resume lo central del párrafo.'},
  {t:'El vidrio, el papel y el aluminio se pueden reciclar varias veces.',cat:'Idea secundaria',why:'Da ejemplos de materiales.'},
  {t:'En muchas comunidades hay puntos de recolección de plástico.',cat:'Idea secundaria',why:'Aporta un dato que apoya la idea central.'},
  {t:'Separar los residuos en casa facilita su reciclaje.',cat:'Idea secundaria',why:'Explica cómo contribuir.'}]},
 cards:[
  C('Idea principal','La idea principal es lo más importante que dice un texto.','En un párrafo sobre el reciclaje: «Reciclar reduce la basura».',mcq('¿Qué función tienen las ideas secundarias?',['Apoyar o explicar la idea principal','Reemplazar el título','Contradecir siempre al autor','Resumir toda la obra'],0,'Desarrollan, ejemplifican o sostienen la idea principal.','Giran en torno a la idea central.')),
  C('Elegir la principal','Es la oración que resume de qué trata el texto.','Título «Beneficios de dormir bien»: la principal habla de esos beneficios.',mcq('Si el título es «Beneficios de dormir bien», ¿cuál oración sería la idea principal?',['Dormir bien mejora la memoria y el ánimo.','Algunas personas duermen en la tarde.','El colchón puede ser de varios tipos.','La luz del cuarto es amarilla.'],0,'Resume el beneficio central del que habla el título.','Busca la oración más cercana al título.')),
  C('Cómo encontrarla','Pregúntate de qué trata el texto y qué dice sobre eso.','Tema: el reciclaje. Lo que dice: reduce la basura.',mcq('Para hallar la idea principal conviene preguntarse…',['¿De qué trata el texto y qué dice sobre eso?','¿Cuántas palabras tiene?','¿Cuál es la oración más larga?','¿Quién lo copió?'],0,'Esa pregunta lleva al tema y a lo que el autor afirma de él.','Piensa en el tema y en lo que se dice de él.'))]}),
L3({id:'lyl-em-ret',ciclos:['em'],subject:'lyl',unit:'Unidad 4 · Discurso Persuasivo y Ensayos',temario:'Recursos retóricos: ethos, pathos, logos',title:'Ethos, pathos y logos',skill:'Reconocer recursos persuasivos en un discurso',diff:2,min:9,
 teoria:['Un discurso persuasivo busca convencer. Aristóteles describió tres recursos: ethos (credibilidad de quien habla), pathos (emociones de quien escucha) y logos (razones, datos y lógica).','Un buen discurso combina los tres: el ethos hace confiable al orador, el pathos conecta con la audiencia y el logos sostiene la tesis con argumentos.','Reconocerlos ayuda a escuchar con sentido crítico: no basta con que algo conmueva o que lo diga alguien con prestigio; hay que revisar si las razones son sólidas.'],
 historia:'Aristóteles (siglo IV a. C.) reunió estas ideas en su «Retórica», un tratado sobre el arte de persuadir. Siglos después, el orador y político romano Cicerón (106–43 a. C.) las llevó a la práctica en sus discursos y escribió sobre cómo hablar en público.',
 personajes:[{n:'Aristóteles',d:'Filósofo griego (384–322 a. C.), autor de la «Retórica».'},{n:'Cicerón',d:'Orador, político y escritor romano (106–43 a. C.).'}],
 ejemplos:[{t:'Analizar un fragmento',pasos:['Fragmento: «Soy médica hace 20 años; el 85 % de mis pacientes mejoró con este hábito. Imaginen a una niña que ya no se enferma».','«Soy médica hace 20 años» apela al ethos: da credibilidad.','«El 85 % de mis pacientes mejoró» apela al logos: ofrece un dato.','«Imaginen a una niña que ya no se enferma» apela al pathos: busca emocionar.']}],
 clasif:{titulo:'Laboratorio: ¿ethos, pathos o logos?',ayuda:'Clasifica el recurso principal de cada frase.',cats:['Ethos','Pathos','Logos'],items:[
  {t:'Como médica con 20 años de experiencia, les aseguro que este hábito es seguro.',cat:'Ethos',why:'Se apoya en la experiencia de quien habla.'},
  {t:'Imaginen a una niña esperando, sola y asustada, un autobús que no llega.',cat:'Pathos',why:'Busca provocar una emoción.'},
  {t:'El 85 % de los estudiantes que repasaron a diario mejoró sus notas.',cat:'Logos',why:'Usa un dato como argumento.'},
  {t:'Soy ingeniero y llevo una década construyendo puentes.',cat:'Ethos',why:'Presenta credenciales.'},
  {t:'Si no actuamos hoy, ¿cómo miraremos a nuestros hijos?',cat:'Pathos',why:'Apela a los sentimientos.'},
  {t:'Dos de cada tres accidentes ocurren por exceso de velocidad, según el informe.',cat:'Logos',why:'Aporta una cifra y una fuente.'}]},
 cards:[
  C('Tres recursos','Ethos es credibilidad, pathos es emoción y logos es razón.','Citar datos apela al logos; contar una historia conmovedora, al pathos.',mcq('Un orador cuenta una historia que conmueve a la audiencia. ¿Qué recurso usa?',['Logos','Ethos','Pathos','Tesis'],2,'Apelar a las emociones es pathos.','Piensa en la palabra «emoción».')),
  C('Datos y estadísticas','Los datos y las razones son logos.','«El 85 % mejoró» es un argumento con datos.',mcq('Citar estadísticas y datos apela sobre todo al…',['Logos','Pathos','Ethos','Tesis'],0,'Los datos y la lógica son logos.','Es un argumento basado en razones.')),
  C('Credibilidad','Mencionar experiencia y credenciales refuerza la confianza en el orador.','«Soy ingeniero desde hace diez años».',mcq('Mencionar la experiencia y las credenciales del orador es un recurso de…',['Ethos','Logos','Pathos','Narración'],0,'La credibilidad de quien habla es ethos.','Se trata de la confianza en el orador.'))]}),
/* ================= INGLÉS ================= */
L3({id:'ing-tc-tobe',ciclos:['tc'],subject:'ing',unit:'Unidad 1 · Personal Information & Greetings',temario:'Verb To Be',title:'Verb To Be',skill:'Usar am, is y are en oraciones afirmativas, negativas y preguntas',diff:1,min:8,
 teoria:['El verbo to be significa «ser» o «estar». En presente cambia según el sujeto: I am, you are, he/she/it is, we/they are.','Para negar se añade not: I am not, he is not (isn\'t), they are not (aren\'t). Para preguntar se invierte el orden: Are you a student?','Se usa para decir nombre, edad, profesión, nacionalidad y cómo estás: I am Ana. She is from El Salvador. We are fine.'],
 historia:'To be es uno de los verbos más antiguos y más irregulares del inglés: reúne formas que vienen de raíces diferentes del inglés antiguo (am, is, are y be). Por eso sus formas no siguen ninguna regla y hay que memorizarlas.',
 formulas:['I am','He / She / It is','You / We / They are','Negativa: am not · is not (isn\'t) · are not (aren\'t)'],
 ejemplos:[{t:'Oraciones afirmativas',pasos:['Con I usamos am: I am a student.','Con she usamos is: She is my sister.','Con they usamos are: They are friends.']},
  {t:'Preguntas',pasos:['Afirmación: You are ready.','Invierte el orden: Are you ready?','Respuesta corta: Yes, I am. / No, I\'m not.']}],
 clasif:{titulo:'Laboratorio: am, is o are',ayuda:'Elige la forma correcta para cada sujeto.',cats:['am','is','are'],items:[
  {t:'I',cat:'am',why:'Con I siempre se usa am.'},{t:'She',cat:'is',why:'He, she e it usan is.'},{t:'They',cat:'are',why:'We, you y they usan are.'},
  {t:'The book',cat:'is',why:'«The book» equivale a it.'},{t:'We',cat:'are',why:'We usa are.'},{t:'My parents',cat:'are',why:'«My parents» equivale a they.'},{t:'You',cat:'are',why:'You usa are.'},{t:'It',cat:'is',why:'It usa is.'}]},
 cards:[
  C('I am, you are, she is','El verbo to be cambia según el sujeto.','I am Ana. She is my friend. We are students.',mcq('My sister ___ a teacher.',['am','is','are','be'],1,'Con «my sister» (she) usamos is.','Sustituye «my sister» por she.')),
  C('Plurales','Con we, you y they usamos are.','They are my friends.',mcq('They ___ my friends.',['is','am','are','be'],2,'Con they usamos are.','Fíjate en el sujeto plural.')),
  C('Escribir la forma','Completa con la forma correcta de to be.','He is from Santa Ana.',inp('Completa con am, is o are: She ___ from El Salvador.',['is'],'Con she usamos is.','Sustituye she por el sujeto equivalente.'))]}),
L3({id:'ing-em-pp',ciclos:['em'],subject:'ing',unit:'Unidad 1 · Present & Past Connected Actions',temario:'Present Perfect vs. Past Simple',title:'Present perfect y past simple',skill:'Elegir entre present perfect y past simple',diff:2,min:9,
 teoria:['El present perfect se forma con have/has + participio y conecta el pasado con el presente: I have lived here for five years (todavía vivo aquí).','El past simple habla de una acción terminada en un momento concreto del pasado: I lived in Santa Ana in 2019 (ya no vivo allí).','Con for se indica una duración (for two years) y con since, el punto de inicio (since 2020).'],
 historia:'El inglés actual separa con claridad el pasado terminado (past simple) del pasado con relevancia en el presente (present perfect). En español ocurre algo parecido con «he vivido» y «viví», aunque en muchas regiones se alternan.',
 formulas:['Present perfect: have / has + participio','Past simple: verbo en pasado (-ed o irregular)','for + período · since + punto de inicio'],
 ejemplos:[{t:'For y since',pasos:['Quiero decir que estudio inglés desde 2022, y todavía lo hago.','Es una acción que continúa: present perfect.','Con punto de inicio uso since: I have studied English since 2022.','Con duración uso for: I have studied English for four years.']},
  {t:'Past simple con fecha',pasos:['«Ayer vi esa película»: hay un momento concreto terminado.','Usa past simple: I saw that movie yesterday.','No se usa present perfect con yesterday.']}],
 clasif:{titulo:'Laboratorio: present perfect o past simple',ayuda:'Clasifica cada oración según el tiempo verbal.',cats:['Present perfect','Past simple'],items:[
  {t:'I have lived here for five years.',cat:'Present perfect',why:'Usa have + participio y conecta con el presente.'},
  {t:'I lived in Santa Ana in 2019.',cat:'Past simple',why:'Acción terminada en un año concreto.'},
  {t:'She has visited Guatemala twice.',cat:'Present perfect',why:'Experiencia sin fecha concreta.'},
  {t:'They watched the game yesterday.',cat:'Past simple',why:'«Yesterday» marca un momento terminado.'},
  {t:'We have just finished.',cat:'Present perfect',why:'«Just» con have + participio.'},
  {t:'He moved to San Miguel last year.',cat:'Past simple',why:'«Last year» marca un momento concreto.'}]},
 cards:[
  C('Contrastar los tiempos','Present perfect conecta con el presente; past simple cierra el pasado.','I have lived here for five years / I lived in Santa Ana in 2019.',mcq('He ___ his homework already.',['have finished','has finished','finished has','is finish'],1,'Con «he» usamos has + participio: he has finished.','Después de he se usa has.')),
  C('For y since','For indica duración y since, el punto de inicio.','for two years / since 2020.',mcq('I have lived here ___ 2020.',['since','for','ago','during'],0,'2020 es un punto de inicio: since.','Pregunta si es duración o inicio.')),
  C('Con marcas de tiempo','Con yesterday o last year se usa past simple.','I saw that movie yesterday.',mcq('Elige la oración correcta.',['I have seen that movie yesterday.','I saw that movie yesterday.','I have saw that movie yesterday.','I seen that movie yesterday.'],1,'«Yesterday» pide past simple.','Fíjate en la marca de tiempo.'))]}),
/* ================= CIUDADANÍA Y VALORES ================= */
L3({id:'cyv-dd',ciclos:['tc','em'],subject:'cyv',unit:'Unidad 1 · Derechos Humanos y Convivencia',temario:'Derechos',title:'Derechos y deberes',skill:'Distinguir derechos y deberes en situaciones cotidianas',diff:1,min:8,
 teoria:['Los derechos humanos son garantías que tiene toda persona por el hecho de serlo: educación, salud, opinión, vivir sin violencia. Los deberes son responsabilidades que hacen posible la convivencia.','Ejercer un derecho no debe vulnerar el de otra persona: mi derecho a opinar convive con el deber de escuchar a los demás.','Derechos y deberes se complementan: respetar las normas y cuidar los bienes comunes protege los derechos de todos.'],
 historia:'En 1789, la Declaración de los Derechos del Hombre y del Ciudadano, en Francia, afirmó que las personas nacen libres e iguales en derechos. En 1948 la ONU aprobó la Declaración Universal de los Derechos Humanos, redactada por una comisión presidida por Eleanor Roosevelt.',
 personajes:[{n:'Eleanor Roosevelt',d:'Estadounidense (1884–1962) que presidió la comisión de la ONU que redactó la Declaración Universal de Derechos Humanos.'}],
 ejemplos:[{t:'Dos compañeros quieren opinar',pasos:['Situación: Marco y Ana quieren hablar al mismo tiempo en clase.','Derecho: ambos tienen derecho a expresar su opinión.','Deber: cada uno debe escuchar y esperar su turno.','Acuerdo: se organizan turnos y todos pueden participar.']}],
 clasif:{titulo:'Laboratorio: ¿derecho o deber?',ayuda:'Clasifica cada situación.',cats:['Derecho','Deber'],items:[
  {t:'Recibir educación',cat:'Derecho',why:'Es un derecho humano básico.'},
  {t:'Respetar las normas de convivencia',cat:'Deber',why:'Es una responsabilidad compartida.'},
  {t:'Expresar mi opinión',cat:'Derecho',why:'Es la libertad de expresión.'},
  {t:'Cuidar los bienes comunes',cat:'Deber',why:'Protege lo que usamos entre todos.'},
  {t:'Vivir sin violencia',cat:'Derecho',why:'Toda persona merece seguridad.'},
  {t:'Escuchar a los demás',cat:'Deber',why:'Hace posible el diálogo.'}]},
 cards:[
  C('Deberes ciudadanos','Los deberes aseguran la convivencia.','Respetar las normas ayuda a que todos ejerzan sus derechos.',mcq('¿Cuál es un ejemplo de deber ciudadano?',['Respetar las normas de convivencia','Ignorar los acuerdos','Opinar sin escuchar','Evitar participar siempre'],0,'Respetar las normas permite que todos ejerzan sus derechos.','Un deber es una responsabilidad hacia los demás.')),
  C('Opinar y escuchar','El derecho a opinar va de la mano de escuchar.','Cada persona espera su turno.',mcq('El derecho a opinar implica también…',['Escuchar y respetar otras opiniones','Interrumpir a quien piensa distinto','Opinar sin informarse','Callar siempre'],0,'Los derechos se ejercen respetando a los demás.','Piensa en lo que necesita un diálogo.')),
  C('Declaración Universal','La ONU aprobó en 1948 la Declaración Universal de los Derechos Humanos.','Es un texto de referencia para muchos países.',mcq('¿Qué documento aprobó la ONU en 1948?',['Declaración Universal de los Derechos Humanos','Acta de Independencia','Código Civil','Convención sobre el Clima'],0,'Fue aprobada el 10 de diciembre de 1948.','Es un documento sobre derechos humanos.'))]}),
/* ================= TEMAS ADICIONALES ================= */
L3({id:'adi-nut',ciclos:ALL,subject:'adi',unit:'Módulo 1 · Educación en Salud y Nutrición',temario:'Alimentación equilibrada',title:'Alimentación equilibrada',skill:'Armar comidas variadas con los grupos de alimentos',diff:1,min:8,
 teoria:['Una alimentación equilibrada combina cereales y tubérculos (tortilla de maíz, arroz, yuca), frutas y verduras, y proteínas (frijoles, huevo, pescado, carne), con pocas grasas, azúcares y alimentos ultraprocesados.','Las proteínas ayudan a construir y reparar tejidos; las frutas y verduras aportan vitaminas, minerales y fibra; los cereales y tubérculos dan energía. Beber agua a lo largo del día es la mejor forma de hidratarse.','Esta es información general educativa y no reemplaza la orientación de una persona profesional de la salud.'],
 historia:'En 1992 el Departamento de Agricultura de Estados Unidos publicó una pirámide alimentaria y en 2011 la reemplazó por «MyPlate», un plato dividido en grupos. En Centroamérica, el INCAP, fundado en 1949, ha impulsado guías alimentarias que adaptan estas ideas a los alimentos de la región.',
 ejemplos:[{t:'Armar un desayuno',pasos:['Elige una base de energía: tortilla de maíz.','Añade una proteína: frijoles o un huevo.','Suma una fruta: papaya o banano.','Acompaña con agua en lugar de una bebida azucarada.']}],
 clasif:{titulo:'Laboratorio: ¿a qué grupo pertenece?',ayuda:'Clasifica cada alimento según su aporte principal.',cats:['Cereales y tubérculos','Frutas y verduras','Proteínas','Consumo ocasional'],items:[
  {t:'Tortilla de maíz',cat:'Cereales y tubérculos',why:'Aporta sobre todo carbohidratos.'},
  {t:'Frijoles',cat:'Proteínas',why:'Las legumbres aportan proteína vegetal.'},
  {t:'Papaya',cat:'Frutas y verduras',why:'Es una fruta con vitaminas y fibra.'},
  {t:'Ensalada de repollo y tomate',cat:'Frutas y verduras',why:'Son verduras.'},
  {t:'Huevo',cat:'Proteínas',why:'Es una fuente de proteína.'},
  {t:'Refresco azucarado',cat:'Consumo ocasional',why:'Aporta mucha azúcar y pocos nutrientes.'},
  {t:'Pan dulce',cat:'Consumo ocasional',why:'Tiene azúcar y grasa; se disfruta de vez en cuando.'},
  {t:'Yuca',cat:'Cereales y tubérculos',why:'Es un tubérculo energético.'}]},
 cards:[
  C('Proteínas','Las proteínas construyen y reparan tejidos.','Frijoles, huevo, pescado y carne las aportan.',mcq('¿Qué función principal tienen las proteínas?',['Construir y reparar tejidos','Dar sabor','Reemplazar el agua','Solo dar energía rápida'],0,'Forman parte de músculos, piel y defensas.','Piensa en el crecimiento y la reparación.')),
  C('Hidratación','El agua es la mejor forma de hidratarse.','Llevar una botella de agua ayuda a tomarla a lo largo del día.',mcq('¿Cuál es una buena opción para hidratarte?',['Agua','Refresco azucarado','Bebida energética','Café con azúcar'],0,'El agua hidrata sin añadir azúcar.','Elige la opción sin azúcar.')),
  C('Comidas completas','Combina grupos de alimentos en cada comida.','Tortilla, frijoles y fruta forman un desayuno variado.',mcq('Un desayuno equilibrado combina…',['Cereal o tortilla, fruta y una proteína','Solo pan dulce','Solo refresco','Nada'],0,'Así recibes energía, vitaminas y proteínas.','Piensa en los tres grupos principales.'))]}),
L3({id:'adi-fin',ciclos:ALL,subject:'adi',unit:'Módulo 2 · Finanzas Personales',temario:'Presupuesto personal',title:'Presupuesto personal',skill:'Distribuir ingresos entre necesidades, deseos y ahorro',diff:1,min:8,
 teoria:['Un presupuesto compara lo que ingresa con lo que gastas. La diferencia es lo que puedes ahorrar. Planificarlo ayuda a decidir con calma, no a vivir con prohibiciones.','Las necesidades son gastos básicos (alimentación, transporte, útiles escolares). Los deseos son gustos que puedes posponer. El ahorro es la parte que reservas para metas y emergencias.','Una regla orientativa popular es 50/30/20: 50 % necesidades, 30 % deseos y 20 % ahorro. Es solo un punto de partida; cada persona la adapta a su situación.'],
 historia:'La palabra «presupuesto» comparte origen con el inglés «budget», que viene del francés antiguo «bougette», una bolsita de cuero. La regla 50/30/20 se popularizó con el libro «All Your Worth» (2005), de Elizabeth Warren y Amelia Warren Tyagi. En El Salvador, el dólar estadounidense circula como moneda desde 2001.',
 personajes:[{n:'Elizabeth Warren y Amelia Warren Tyagi',d:'Autoras del libro «All Your Worth» (2005), donde se popularizó la regla 50/30/20.'}],
 formulas:['Ahorro = ingresos − gastos','Regla orientativa: 50 % necesidades · 30 % deseos · 20 % ahorro'],
 ejemplos:[{t:'Regla 50/30/20 con $200',pasos:['Ingresos del mes: $200.','Necesidades: 50 % de 200 = $100.','Deseos: 30 % de 200 = $60.','Ahorro: 20 % de 200 = $40.']},
  {t:'¿Cuánto puedo ahorrar?',pasos:['Ingresos: $50 y gastos: $35.','Ahorro = 50 − 35.','Puedes ahorrar hasta $15.']}],
 sim:'presupuesto',
 cards:[
  C('Ahorro = ingresos − gastos','La diferencia entre ingresos y gastos es lo que puedes ahorrar.','Con $50 de ingresos y $35 de gastos quedan $15.',inp('Con ingresos de $50 y gastos de $35, ¿cuánto puedes ahorrar como máximo?',['15','15.00'],'$50 − $35 = $15.','Resta los gastos de los ingresos.')),
  C('Regla 50/30/20','Es una guía orientativa para repartir los ingresos.','Con $200: $100, $60 y $40.',inp('Con la regla 50/30/20 y $300 de ingresos, ¿cuántos dólares van a ahorro?',['60'],'20 % de 300 = $60.','Calcula el 20 % de 300.')),
  C('Necesidades y deseos','Las necesidades son gastos básicos; los deseos se pueden posponer.','Comida es necesidad; una consola nueva es deseo.',mcq('Un gasto de necesidad es…',['Alimentación','Entradas a un concierto','Videojuego nuevo','Ropa de moda'],0,'La alimentación es un gasto básico.','Piensa en lo imprescindible.'))]}),
L3({id:'adi-pv',ciclos:ALL,subject:'adi',unit:'Módulo 3 · Proyecto de Vida',temario:'Metas específicas y medibles',title:'Metas específicas y medibles (SMART)',skill:'Formular metas claras con plazo',diff:1,min:8,
 teoria:['Una meta es más alcanzable cuando es específica, medible, realista, relevante y tiene fecha. Estas cinco ideas forman la sigla SMART en inglés.','Una meta vaga como «ser mejor estudiante» no dice qué hacer. Convertirla en «resolver 5 ejercicios de matemática, 3 días por semana, durante un mes» permite saber si la cumpliste.','Dividir una meta grande en pasos pequeños y revisarla de vez en cuando te ayuda a ajustar el rumbo sin culpa.'],
 historia:'La sigla SMART se atribuye a George T. Doran, quien la presentó en 1981 en un artículo sobre cómo escribir metas y objetivos en la gestión de organizaciones. Con el tiempo se extendió a la educación y al desarrollo personal.',
 personajes:[{n:'George T. Doran',d:'Consultor estadounidense a quien se atribuye la sigla SMART, presentada en 1981.'}],
 ejemplos:[{t:'De una meta vaga a una SMART',pasos:['Meta vaga: «quiero mejorar en inglés».','Específica y medible: practicar 15 minutos de inglés.','Con frecuencia: 4 días por semana.','Con fecha: durante un mes.','Meta SMART: practicar 15 minutos de inglés, 4 días por semana, durante un mes.']}],
 clasif:{titulo:'Laboratorio: ¿meta clara o vaga?',ayuda:'Clasifica cada meta.',cats:['Meta clara y medible','Meta vaga'],items:[
  {t:'Leer 10 páginas diarias durante 3 semanas',cat:'Meta clara y medible',why:'Tiene cantidad, frecuencia y plazo.'},
  {t:'Ser mejor estudiante',cat:'Meta vaga',why:'No dice qué hacer ni cómo medirlo.'},
  {t:'Practicar 15 minutos de inglés, 4 días por semana, durante un mes',cat:'Meta clara y medible',why:'Se puede comprobar.'},
  {t:'Estudiar más algún día',cat:'Meta vaga',why:'No tiene cantidad ni fecha.'},
  {t:'Ahorrar $5 por semana durante 2 meses',cat:'Meta clara y medible',why:'Tiene monto y plazo.'},
  {t:'Tener éxito',cat:'Meta vaga',why:'Es muy general.'}]},
 cards:[
  C('Meta específica','Una meta específica y medible dice cuánto y hasta cuándo.','Leer 10 páginas diarias durante 3 semanas.',mcq('¿Cuál meta es más específica y medible?',['Ser mejor estudiante','Leer 10 páginas diarias durante 3 semanas','Estudiar algún día','Tener éxito'],1,'Indica cantidad, frecuencia y plazo.','Busca la que se pueda comprobar.')),
  C('La T de SMART','La T se refiere al tiempo: una fecha o plazo.','«Durante un mes».',mcq('En SMART, la «T» significa…',['Con tiempo definido','Tarea','Talento','Tecnología'],0,'Time-bound: con un plazo.','Pregúntate hasta cuándo.')),
  C('Convertir una meta','Cada meta vaga puede hacerse concreta.','«Mejorar en matemática» puede ser «resolver 5 ejercicios, 3 días por semana, durante un mes».',mcq('¿Cuál convierte «quiero mejorar en matemática» en una meta SMART?',['Resolver 5 ejercicios de matemática, 3 días por semana, durante un mes','Estudiar mucho','Ser el mejor','Mejorar pronto'],0,'Tiene cantidad, frecuencia y plazo.','Debe incluir números y un plazo.'))]}),
L3({id:'adi-sxxi',ciclos:ALL,subject:'adi',unit:'Módulo 4 · Habilidades del Siglo XXI',temario:'Pensamiento crítico: hechos y opiniones',title:'Pensamiento crítico: hechos y opiniones',skill:'Distinguir hechos de opiniones y verificar fuentes',diff:1,min:8,
 teoria:['Un hecho se puede comprobar con evidencia («el agua hierve a 100 °C al nivel del mar»). Una opinión expresa una valoración personal («esa canción es la más bonita») y no se comprueba como un dato.','El pensamiento crítico consiste en preguntarse quién lo dice, con qué evidencia y si otras fuentes lo confirman, antes de aceptar o compartir una información.','Es una de las «4 C» de las habilidades del siglo XXI, junto con comunicación, colaboración y creatividad.'],
 historia:'El marco de «habilidades del siglo XXI» se difundió desde 2002 gracias a la organización estadounidense Partnership for 21st Century Skills (P21), que agrupó el pensamiento crítico, la comunicación, la colaboración y la creatividad como competencias clave para la escuela y el trabajo.',
 ejemplos:[{t:'Antes de compartir una noticia',pasos:['Lees un titular muy llamativo en redes sociales.','Pregunta: ¿quién lo publica y qué evidencia presenta?','Busca otra fuente confiable que lo confirme.','Si no encuentras confirmación, no lo compartas todavía.']}],
 clasif:{titulo:'Laboratorio: ¿hecho u opinión?',ayuda:'Clasifica cada enunciado.',cats:['Hecho','Opinión'],items:[
  {t:'El Salvador se independizó de España en 1821.',cat:'Hecho',why:'Se puede comprobar en fuentes históricas.'},
  {t:'La matemática es aburrida.',cat:'Opinión',why:'Es una valoración personal.'},
  {t:'El agua hierve a 100 °C al nivel del mar.',cat:'Hecho',why:'Se comprueba con un experimento.'},
  {t:'El mejor deporte es el fútbol.',cat:'Opinión',why:'Depende del gusto de cada persona.'},
  {t:'La Tierra gira alrededor del Sol.',cat:'Hecho',why:'Está comprobado por la astronomía.'},
  {t:'Esa canción es la más bonita.',cat:'Opinión',why:'Es un juicio de gusto.'}]},
 cards:[
  C('Hechos y opiniones','Un hecho se puede comprobar; una opinión es una valoración.','«Un triángulo tiene tres lados» es un hecho.',mcq('¿Cuál enunciado es un hecho?',['Un triángulo tiene tres lados.','Las tardes son más lindas que las mañanas.','Ese libro es muy aburrido.','Nadie aprende bien en grupo.'],0,'Se puede comprobar con evidencia.','Busca el que cualquiera pueda verificar.')),
  C('Verificar fuentes','Antes de compartir, verifica quién lo dice y si otra fuente lo confirma.','Busca la noticia en un medio confiable.',mcq('Antes de compartir una noticia en redes, lo más útil es…',['Verificar la fuente y buscar otra que la confirme','Compartirla rápido','Fijarse solo en el título','Preguntar a un desconocido'],0,'Contrastar fuentes reduce el riesgo de difundir información falsa.','Piensa en confirmar antes de compartir.')),
  C('Las 4 C','Las «4 C» son pensamiento crítico, comunicación, colaboración y creatividad.','Se trabajan en proyectos en equipo.',mcq('Las «4 C» incluyen…',['Pensamiento crítico, comunicación, colaboración y creatividad','Calor, cambio, color y caja','Copiar, cortar, comprar y cobrar','Ninguna de las anteriores'],0,'Son las cuatro competencias del marco P21.','Recuerda las cuatro palabras que empiezan con C.'))]})

LESSONS.push(
L3({id:'mat-7-plano',subject:'mat',notaUnidades:'Este tema cubre contenido de dos unidades del programa oficial: las gráficas de proporcionalidad (7.º, Unidad 6) y la función lineal y = mx + b (8.º, Unidad 3). Se ubica en 8.º porque su contenido principal, la función lineal, es de la Unidad 3 de 8.º. La parte de gráficas de proporcionalidad corresponde a 7.º, Unidad 6, y todavía no tiene un tema propio.',title:'Plano cartesiano y función lineal',skill:'Ubicar puntos y evaluar funciones lineales',diff:1,min:9,
 teoria:['El plano cartesiano está formado por dos rectas numéricas perpendiculares: el eje x (horizontal) y el eje y (vertical). Se cruzan en el origen (0, 0) y dividen el plano en cuatro cuadrantes.','Cada punto se describe con un par ordenado (x, y): primero se avanza en horizontal y luego en vertical. Por ejemplo, (3, −2) está 3 unidades a la derecha y 2 hacia abajo, en el cuadrante IV.','Una función lineal tiene la forma y = mx + b. Cuando b = 0 queda y = mx, que representa una proporcionalidad directa: su gráfica es una recta que pasa por el origen.'],
 historia:'El plano cartesiano lleva el nombre de René Descartes (en latín, Cartesius), quien en 1637 publicó «La Geometría» y mostró cómo describir figuras con coordenadas. Esa idea unió el álgebra con la geometría y permitió dibujar funciones.',
 personajes:[{n:'René Descartes',d:'Filósofo y matemático francés (1596–1650) que unió álgebra y geometría con el sistema de coordenadas.'}],
 formulas:['Punto: (x, y)','Función lineal: y = m·x + b','Proporcionalidad directa: y = m·x'],
 ejemplos:[{t:'Ubicar el punto (3, −2)',pasos:['Parte desde el origen (0, 0).','Avanza 3 unidades a la derecha, porque x = 3.','Baja 2 unidades, porque y = −2.','El punto queda en el cuadrante IV (x positiva, y negativa).']},
  {t:'Evaluar y = 2x + 1',pasos:['Elige un valor de x, por ejemplo x = 3.','Sustituye: y = 2 · 3 + 1.','Calcula: y = 7.','El punto (3, 7) pertenece a la recta.']},
  {t:'Tabla de una proporcionalidad',pasos:['Función: y = 3x.','Si x = 1, y = 3; si x = 2, y = 6; si x = 3, y = 9.','El cociente y ÷ x es siempre 3.','Los puntos (1, 3), (2, 6) y (3, 9) están sobre una recta que pasa por el origen.']}],
 sim:'recta',
 cards:[
  C('Cuadrantes','Los ejes dividen el plano en cuatro cuadrantes: I (+, +), II (−, +), III (−, −) y IV (+, −).','El punto (3, −2) está en el cuadrante IV.',mcq('¿En qué cuadrante está el punto (−2, 5)?',['Cuadrante I','Cuadrante II','Cuadrante III','Cuadrante IV'],1,'x es negativa y y es positiva: cuadrante II.','Mira los signos de x y de y.')),
  C('Evaluar una función','Sustituye x por el número que te dan y calcula.','Si y = 2x + 1 y x = 3, entonces y = 7.',inp('Si y = 2x + 1, ¿cuánto vale y cuando x = 4?',['9'],'y = 2 · 4 + 1 = 9.','Sustituye x por 4.')),
  C('Proporcionalidad directa','Una función y = m·x pasa por el origen y representa proporcionalidad directa.','y = 3x: cada vez que x aumenta 1, y aumenta 3.',mcq('¿Cuál función representa una proporcionalidad directa?',['y = 3x','y = 3x + 2','y = x − 3','y = 5'],0,'Solo y = 3x no tiene término suelto y pasa por el origen.','Busca la que no suma ni resta un número.'))]}),
L3({id:'cfi-trabajo',subject:'cfi',title:'Trabajo mecánico y potencia',skill:'Calcular trabajo y potencia',diff:1,min:9,
 teoria:['En física, el trabajo mecánico se realiza cuando una fuerza mueve un objeto en la misma dirección de la fuerza: W = F · d. Se mide en julios (J), donde 1 J = 1 N · 1 m.','Si la fuerza es perpendicular al desplazamiento, o el objeto no se mueve, esa fuerza no realiza trabajo. Por eso, al caminar con una mochila en horizontal, la fuerza que sostiene la mochila no hace trabajo sobre ella.','La potencia indica qué tan rápido se realiza un trabajo: P = W ÷ t. Se mide en vatios (W), donde 1 W = 1 J/s. Dos personas pueden hacer el mismo trabajo, pero tiene más potencia quien lo hace en menos tiempo.'],
 historia:'James Watt (1736–1819) perfeccionó la máquina de vapor y popularizó la unidad «caballo de vapor» para describir su rendimiento. En su honor, la unidad de potencia del Sistema Internacional se llama vatio (watt). La unidad de trabajo, el julio, recuerda a James Prescott Joule.',
 personajes:[{n:'James Watt',d:'Ingeniero escocés (1736–1819) que perfeccionó la máquina de vapor.'},{n:'James Prescott Joule',d:'Físico inglés (1818–1889) que estudió la relación entre calor y trabajo.'}],
 formulas:['W = F · d','P = W ÷ t','1 J = 1 N · m','1 W = 1 J/s'],
 ejemplos:[{t:'Empujar una caja',pasos:['Datos: F = 50 N y d = 4 m, en la misma dirección.','W = F · d = 50 · 4.','W = 200 J.']},
  {t:'Potencia al empujar',pasos:['Ese trabajo, 200 J, se realiza en 10 s.','P = W ÷ t = 200 ÷ 10.','P = 20 W.']},
  {t:'Levantar una pesa',pasos:['Una pesa de 2 kg sube 3 m; la fuerza necesaria es su peso: F = 2 · 9,8 = 19,6 N.','W = F · d = 19,6 · 3.','W = 58,8 J.']}],
 sim:'trabajo',
 cards:[
  C('Trabajo','W = F · d cuando la fuerza va en la dirección del movimiento.','50 N a lo largo de 4 m realizan 200 J.',inp('Una fuerza de 30 N mueve un carrito 5 m en su misma dirección. ¿Qué trabajo realiza, en J?',['150'],'W = 30 · 5 = 150 J.','Multiplica fuerza por distancia.')),
  C('Potencia','P = W ÷ t.','200 J en 10 s son 20 W.',inp('Un motor realiza 600 J de trabajo en 20 s. ¿Qué potencia desarrolla, en W?',['30'],'P = 600 ÷ 20 = 30 W.','Divide el trabajo entre el tiempo.')),
  C('Cuándo no hay trabajo','Una fuerza perpendicular al movimiento no realiza trabajo.','Sostener una mochila mientras caminas en horizontal.',mcq('¿En qué caso una fuerza NO realiza trabajo sobre un objeto?',['Cuando es perpendicular al desplazamiento','Cuando el objeto se mueve en la dirección de la fuerza','Cuando la fuerza es muy grande','Cuando hay gravedad'],0,'Sin componente en la dirección del movimiento, no hay trabajo.','Piensa en la dirección de la fuerza y la del movimiento.'))]}),
L3({id:'cfi-calor',subject:'cfi',title:'Calor y temperatura',skill:'Calcular el calor necesario para cambiar una temperatura',diff:2,min:9,
 teoria:['La temperatura mide qué tan agitadas están, en promedio, las partículas de un cuerpo. El calor es la energía que pasa de un cuerpo a otro cuando hay diferencia de temperatura, siempre del más caliente al más frío.','Cuando dos cuerpos en contacto llegan a la misma temperatura, alcanzan el equilibrio térmico y dejan de intercambiar calor neto.','El calor necesario para cambiar la temperatura de una sustancia es Q = m · c · ΔT, donde c es el calor específico. El agua necesita 4,18 J por gramo y por °C, mucho más que los metales, por eso tarda más en calentarse.'],
 historia:'Antiguamente se creía que el calor era un fluido invisible llamado «calórico». En la década de 1840, James Prescott Joule demostró con experimentos que el trabajo mecánico puede convertirse en calor, y que ambos son formas de energía. Por eso el julio es hoy la unidad de energía.',
 personajes:[{n:'James Prescott Joule',d:'Físico inglés (1818–1889) que midió la equivalencia entre trabajo mecánico y calor.'}],
 formulas:['Q = m · c · ΔT','ΔT = T final − T inicial','c del agua ≈ 4,18 J/(g·°C)','1 cal ≈ 4,18 J'],
 ejemplos:[{t:'Calentar agua',pasos:['Datos: 100 g de agua pasan de 20 °C a 50 °C; c = 4,18.','ΔT = 50 − 20 = 30 °C.','Q = m · c · ΔT = 100 · 4,18 · 30.','Q = 12 540 J.']},
  {t:'Aluminio frente a agua',pasos:['Con 100 g y ΔT = 10 °C, el aluminio (c ≈ 0,90) necesita Q = 100 · 0,90 · 10 = 900 J.','El agua (c = 4,18) necesita Q = 100 · 4,18 · 10 = 4180 J.','El agua necesita unas 4,6 veces más calor para el mismo cambio.']},
  {t:'Equilibrio térmico',pasos:['Se mezclan masas iguales de agua a 80 °C y a 20 °C.','El calor pasa del agua caliente a la fría hasta igualar temperaturas.','La temperatura final es 50 °C, el promedio de 80 y 20.']}],
 sim:'calor',
 cards:[
  C('Calor y temperatura','El calor es energía transferida; la temperatura mide la agitación de las partículas.','Una taza caliente cede calor al ambiente más frío.',mcq('El calor es…',['energía que se transfiere por una diferencia de temperatura','la temperatura de un cuerpo','un material caliente','frío almacenado'],0,'El calor siempre pasa del cuerpo más caliente al más frío.','Piensa en el sentido en que fluye.')),
  C('Calcular Q','Q = m · c · ΔT.','100 g de agua que suben 10 °C: 4180 J.',inp('¿Cuántos J se necesitan para subir 10 °C la temperatura de 100 g de agua? (c = 4,18 J/(g·°C))',['4180'],'Q = 100 · 4,18 · 10 = 4180 J.','Multiplica masa, c y ΔT.')),
  C('Cambio de temperatura','ΔT es la temperatura final menos la inicial.','De 25 a 40 °C: ΔT = 15 °C.',inp('El agua pasa de 25 °C a 40 °C. ¿Cuál es ΔT, en °C?',['15'],'ΔT = 40 − 25 = 15 °C.','Resta la temperatura inicial a la final.'))]}),
L3({id:'cfi-onda',subject:'cfi',title:'Ondas: frecuencia, longitud de onda y rapidez',skill:'Relacionar v, λ y f',diff:2,min:9,
 teoria:['Una onda transporta energía de un lugar a otro sin transportar materia. Las ondas mecánicas, como el sonido, necesitan un medio material; las electromagnéticas, como la luz, pueden viajar en el vacío.','Una onda se describe con su longitud de onda (λ, la distancia entre dos crestas), su frecuencia (f, cuántas oscilaciones ocurren por segundo, en hertz) y su rapidez (v). Se relacionan con v = λ · f. El periodo es T = 1 ÷ f.','El sonido viaja en el aire a unos 343 m/s a 20 °C. La luz es mucho más rápida: unos 300 000 km/s.'],
 historia:'Christiaan Huygens (1629–1695) propuso en el siglo XVII que la luz se comporta como una onda. Más tarde, Heinrich Hertz (1857–1894) demostró experimentalmente, hacia 1887, la existencia de las ondas electromagnéticas, y la unidad de frecuencia, el hertz, lleva su nombre.',
 personajes:[{n:'Christiaan Huygens',d:'Físico y matemático neerlandés (1629–1695) que propuso la naturaleza ondulatoria de la luz.'},{n:'Heinrich Hertz',d:'Físico alemán (1857–1894) que demostró la existencia de las ondas electromagnéticas.'}],
 formulas:['v = λ · f','f = 1 ÷ T','λ = v ÷ f'],
 ejemplos:[{t:'Rapidez de una onda',pasos:['Datos: λ = 2 m y f = 5 Hz.','v = λ · f = 2 · 5.','v = 10 m/s.']},
  {t:'Longitud de onda de un sonido',pasos:['Datos: v = 343 m/s y f = 686 Hz.','λ = v ÷ f = 343 ÷ 686.','λ = 0,5 m.']},
  {t:'Del periodo a la frecuencia',pasos:['Una onda tarda T = 0,25 s en completar una oscilación.','f = 1 ÷ T = 1 ÷ 0,25.','f = 4 Hz.']}],
 sim:'onda',
 cards:[
  C('Rapidez de una onda','La rapidez es longitud de onda por frecuencia.','Con λ = 2 m y f = 5 Hz, v = 10 m/s.',inp('Una onda tiene λ = 3 m y f = 4 Hz. ¿Cuál es su rapidez, en m/s?',['12'],'v = 3 · 4 = 12 m/s.','Multiplica λ por f.')),
  C('Periodo y frecuencia','La frecuencia es el inverso del periodo.','T = 0,25 s equivale a f = 4 Hz.',inp('Una onda tiene un periodo de 0,5 s. ¿Cuál es su frecuencia, en Hz?',['2'],'f = 1 ÷ 0,5 = 2 Hz.','Divide 1 entre el periodo.')),
  C('Ondas y medio','Las ondas electromagnéticas no necesitan un medio material.','La luz del Sol llega a la Tierra a través del vacío.',mcq('¿Cuál de estas ondas puede viajar en el vacío?',['La luz','El sonido','Una onda en una cuerda','Una ola del mar'],0,'La luz es una onda electromagnética y no necesita medio.','Piensa en la luz del Sol atravesando el espacio.'))]}),
L3({id:'cyt-celula',subject:'cyt',title:'La célula y sus partes',skill:'Relacionar cada estructura celular con su función',diff:1,min:9,
 teoria:['La célula es la unidad básica de los seres vivos: todos están formados por una o más células, y toda célula proviene de otra célula.','Las células eucariotas tienen un núcleo con membrana, donde está el ADN. Las procariotas, como las bacterias, no lo tienen. Las células vegetales, además, tienen pared celular y cloroplastos.','Cada estructura cumple una función: el núcleo controla la célula, las mitocondrias liberan energía, los ribosomas fabrican proteínas y la membrana regula lo que entra y sale.'],
 historia:'En 1665 Robert Hooke observó con un microscopio una lámina de corcho y llamó «células» a los pequeños compartimentos que vio. En el siglo XIX, Schleiden y Schwann propusieron que todos los seres vivos están formados por células, y Virchow añadió que toda célula procede de otra.',
 personajes:[{n:'Robert Hooke',d:'Científico inglés (1635–1703) que observó y nombró las «células» en 1665.'},{n:'Antonie van Leeuwenhoek',d:'Comerciante y microscopista neerlandés (1632–1723) que observó microorganismos con microscopios fabricados por él.'}],
 ejemplos:[{t:'Comparar dos células',pasos:['Célula animal: núcleo, mitocondrias, ribosomas y membrana.','Célula vegetal: tiene todo eso y, además, pared celular y cloroplastos.','Los cloroplastos permiten la fotosíntesis, por eso aparecen en las células vegetales.']},
  {t:'Sin mitocondrias',pasos:['Las mitocondrias liberan energía a partir de los nutrientes.','Sin ellas, la célula tendría mucha menos energía disponible.','Por eso las células que gastan mucha energía, como las musculares, tienen muchas mitocondrias.']},
  {t:'Ruta de una proteína',pasos:['El núcleo guarda el ADN con las instrucciones.','Los ribosomas leen esas instrucciones y fabrican la proteína.','La membrana regula qué sustancias entran y salen de la célula.']}],
 clasif:{titulo:'Laboratorio: ¿qué función cumple?',ayuda:'Relaciona cada estructura con su función principal.',cats:['Control','Energía','Límite y protección','Fabricar proteínas'],items:[
  {t:'Núcleo',cat:'Control',why:'Guarda el ADN y dirige las actividades de la célula.'},
  {t:'Mitocondria',cat:'Energía',why:'Libera energía a partir de los nutrientes.'},
  {t:'Membrana plasmática',cat:'Límite y protección',why:'Regula lo que entra y sale de la célula.'},
  {t:'Ribosoma',cat:'Fabricar proteínas',why:'Ensambla las proteínas.'},
  {t:'Pared celular',cat:'Límite y protección',why:'Da forma y protección extra a las células vegetales.'},
  {t:'Cloroplasto',cat:'Energía',why:'Hace la fotosíntesis y capta la energía de la luz.'}]},
 cards:[
  C('Unidad básica','Todos los seres vivos están formados por células.','Una bacteria tiene una sola célula; una persona, millones.',mcq('La unidad básica de los seres vivos es…',['La célula','El tejido','El órgano','El átomo'],0,'Todos los seres vivos están formados por células.','Piensa en lo más pequeño que ya está vivo.')),
  C('Animal y vegetal','Las células vegetales tienen pared celular y cloroplastos.','La hoja de una planta tiene cloroplastos.',mcq('Una estructura que tienen las células vegetales pero no las animales es…',['La pared celular','El núcleo','La membrana','El ribosoma'],0,'La pared celular es propia de las células vegetales.','Piensa en lo que da rigidez a una planta.')),
  C('Energía celular','Las mitocondrias liberan energía a partir de los nutrientes.','Las células musculares tienen muchas mitocondrias.',mcq('¿Qué estructura libera la mayor parte de la energía de la célula?',['Mitocondria','Núcleo','Ribosoma','Pared celular'],0,'Las mitocondrias liberan energía utilizable por la célula.','Busca la «central de energía».'))]}),
L3({id:'cyt-materiales',subject:'cyt',title:'Materiales cotidianos: conductores y aislantes',skill:'Clasificar materiales según su comportamiento',diff:1,min:8,
 teoria:['Los materiales se eligen por sus propiedades. Un material conductor deja pasar con facilidad la corriente eléctrica o el calor; un aislante la frena.','Los metales (cobre, aluminio, hierro) son buenos conductores. Los plásticos, el vidrio, el caucho y la madera seca son buenos aislantes. Por eso los cables llevan un metal por dentro y plástico por fuera.','Elegir bien un material permite fabricar objetos seguros y duraderos: la olla de metal conduce el calor, pero su mango de plástico o madera protege la mano.'],
 historia:'La humanidad nombró épocas según los materiales que dominó: Edad de Piedra, de Bronce y de Hierro. En 1907 Leo Baekeland inventó la baquelita, el primer plástico totalmente sintético, y abrió la era de los plásticos modernos.',
 personajes:[{n:'Leo Baekeland',d:'Químico belga-estadounidense (1863–1944) que inventó la baquelita en 1907.'}],
 ejemplos:[{t:'Cable eléctrico',pasos:['El cable necesita que la corriente pase por el centro: se usa cobre, un metal conductor.','Por fuera debe proteger a las personas: se usa plástico, un aislante.','Así el cable conduce la electricidad y es seguro tocarlo.']},
  {t:'Mango de una olla',pasos:['La olla de aluminio conduce muy bien el calor.','El mango se calentaría demasiado si fuera también metálico.','Por eso se fabrica con plástico o madera, que conducen poco el calor.']},
  {t:'Un enchufe seguro',pasos:['Las clavijas deben conducir la corriente: son de metal.','La carcasa debe aislar: es de plástico.','Al unir ambos materiales se logra funcionalidad y seguridad.']}],
 clasif:{titulo:'Laboratorio: ¿conductor o aislante?',ayuda:'Clasifica cada material según conduzca o no la electricidad.',cats:['Conductor','Aislante'],items:[
  {t:'Cobre',cat:'Conductor',why:'Es un metal y conduce muy bien la electricidad.'},
  {t:'Plástico',cat:'Aislante',why:'Casi no deja pasar la corriente.'},
  {t:'Aluminio',cat:'Conductor',why:'Los metales son buenos conductores.'},
  {t:'Vidrio',cat:'Aislante',why:'No conduce la electricidad en condiciones normales.'},
  {t:'Hierro',cat:'Conductor',why:'Es un metal conductor.'},
  {t:'Madera seca',cat:'Aislante',why:'Seca, conduce muy poco.'},
  {t:'Caucho',cat:'Aislante',why:'Se usa para cubrir herramientas eléctricas.'}]},
 cards:[
  C('Conductores','Los metales conducen bien la electricidad y el calor.','El cobre de los cables.',mcq('¿Cuál de estos materiales es un buen conductor eléctrico?',['Cobre','Plástico','Vidrio','Caucho'],0,'El cobre es un metal conductor.','Piensa en el interior de un cable.')),
  C('Aislantes','Los aislantes frenan el paso del calor o la electricidad.','El mango de plástico de una olla.',mcq('El mango de una olla suele ser de plástico porque…',['conduce poco el calor','conduce muy bien el calor','es más pesado','brilla más'],0,'Así no se calienta tanto y protege la mano.','Piensa en lo que quieres evitar al tocarlo.')),
  C('Elegir el material','Cada parte de un objeto usa el material que mejor cumple su función.','Cables: metal por dentro y plástico por fuera.',mcq('Un cable eléctrico lleva metal por dentro y plástico por fuera porque…',['el metal conduce y el plástico aísla','el plástico conduce y el metal aísla','ambos conducen','ninguno cumple una función'],0,'Cada material cumple una función distinta y complementaria.','Piensa en qué parte debe conducir y cuál proteger.'))]}),
L3({id:'lyl-leyendas',subject:'lyl',title:'Mito, leyenda y cuento popular',skill:'Distinguir mitos, leyendas y cuentos populares',diff:1,min:9,
 teoria:['El mito explica el origen del mundo, de los dioses o de los seres humanos. La leyenda cuenta hechos extraordinarios ligados a un lugar o a un personaje que la comunidad cuenta como reales. El cuento popular es una narración ficticia que se transmite de generación en generación.','La tradición oral hizo que estos relatos pasaran de boca en boca y cambiaran un poco en cada versión. Todos tienen narrador, personajes, ambiente y una trama con inicio, nudo y desenlace.','En El Salvador son muy conocidas leyendas como la Siguanaba, el Cipitío, el Cadejo y la Carreta Chillona, que reflejan miedos, valores y costumbres de las comunidades.'],
 historia:'Antes de la escritura, los pueblos mesoamericanos conservaban su memoria en relatos orales y en códices. El Popol Vuh, del pueblo maya k\'iche\', recoge mitos de la creación. Más tarde, autores como el salvadoreño Salarrué (1899–1975) recogieron el habla y el espíritu popular en sus «Cuentos de barro» (1933).',
 personajes:[{n:'Salarrué (Salvador Salazar Arrué)',d:'Escritor y pintor salvadoreño (1899–1975), autor de «Cuentos de barro» (1933).'}],
 ejemplos:[{t:'Clasificar un relato',pasos:['Relato: «La Siguanaba se aparece de noche a quienes andan solos».','Pregunta: ¿explica el origen del mundo? No.','¿Está ligado a un lugar y a un personaje que la comunidad cuenta como real? Sí.','Es una leyenda.']},
  {t:'Elementos de una leyenda',pasos:['Elige una leyenda que conozcas, por ejemplo la del Cadejo.','Personajes: el Cadejo y la persona que camina de noche.','Ambiente: caminos oscuros y solitarios.','Trama: aparece, genera miedo o protección y desaparece al amanecer.']},
  {t:'Reconocer un cuento popular',pasos:['Relato: un conejo astuto engaña a un coyote para salvarse.','No explica un origen ni se ata a un lugar real.','Es un cuento popular: un relato ficticio que suele dejar una enseñanza.']}],
 clasif:{titulo:'Laboratorio: ¿mito, leyenda o cuento?',ayuda:'Clasifica cada relato.',cats:['Mito','Leyenda','Cuento popular'],items:[
  {t:'Un relato explica cómo los dioses crearon a los seres humanos.',cat:'Mito',why:'Explica el origen de los seres humanos.'},
  {t:'La Siguanaba se aparece de noche a quienes caminan solos.',cat:'Leyenda',why:'Está ligada a un personaje y a un ambiente que la comunidad cuenta como real.'},
  {t:'Un conejo astuto engaña a un coyote para salvarse.',cat:'Cuento popular',why:'Es ficción con una enseñanza, sin lugar real ni origen del mundo.'},
  {t:'El Cadejo acompaña a quien camina por caminos oscuros.',cat:'Leyenda',why:'Se asocia a lugares y personajes de la tradición local.'},
  {t:'Un relato explica cómo aparecieron el Sol y la Luna.',cat:'Mito',why:'Explica el origen de elementos del mundo.'},
  {t:'Un zorro y un burro viven una aventura y aprenden una lección.',cat:'Cuento popular',why:'Es un relato ficticio con enseñanza.'}]},
 cards:[
  C('Mito','El mito explica el origen del mundo, de los dioses o de las personas.','El Popol Vuh cuenta cómo fueron creados los seres humanos.',mcq('¿Qué tipo de relato explica el origen del mundo o de los seres humanos?',['Mito','Leyenda','Cuento popular','Noticia'],0,'El mito busca explicar orígenes.','Piensa en «creación» y «dioses».')),
  C('Leyenda','La leyenda se vincula a un lugar o a un personaje que la comunidad cuenta como real.','La Siguanaba y el Cadejo.',mcq('Una leyenda se caracteriza porque…',['se vincula a un lugar o personaje que la comunidad cuenta como real','es siempre una noticia','no tiene personajes','solo se escribe en verso'],0,'Se ancla en lugares y personajes de la tradición.','Piensa en la Siguanaba o el Cadejo.')),
  C('Tradición oral','Los relatos se transmitieron de boca en boca antes de la escritura.','Abuelos y abuelas contaban leyendas a los niños.',mcq('¿Cómo se transmitieron estos relatos antes de la escritura?',['De forma oral, de generación en generación','Por televisión','Por correo electrónico','Solo en libros impresos'],0,'La tradición oral conservó la memoria de los pueblos.','Piensa en cómo se contaban antes de los libros.'))]}),
L3({id:'lyl-poesia',subject:'lyl',title:'Verso, estrofa y rima',skill:'Contar sílabas y reconocer la rima',diff:2,min:9,
 teoria:['Un poema se organiza en versos (cada línea) y estrofas (grupos de versos). La métrica cuenta las sílabas de cada verso: uno de 8 sílabas es octosílabo y uno de 11 es endecasílabo.','La rima es la repetición de sonidos al final de los versos, desde la última vocal acentuada. Es consonante si coinciden vocales y consonantes (luna – cuna) y asonante si solo coinciden las vocales (casa – plata).','Para contar sílabas se separa cada palabra en sílabas. Cuando una palabra termina en vocal y la siguiente empieza con vocal, se unen en una sola sílaba (sinalefa).'],
 historia:'El nicaragüense Rubén Darío (1867–1916) renovó la métrica y el ritmo del verso en español con su libro «Azul…» (1888) y fue la figura central del modernismo. En El Salvador, Francisco Gavidia (1863–1955) experimentó con el verso y su obra influyó en Darío.',
 personajes:[{n:'Rubén Darío',d:'Poeta nicaragüense (1867–1916), figura central del modernismo.'},{n:'Francisco Gavidia',d:'Poeta, dramaturgo e historiador salvadoreño (1863–1955), considerado uno de los grandes humanistas del país.'}],
 ejemplos:[{t:'Contar las sílabas de un verso',pasos:['Verso: «Hoy canto bajo la luna».','Separa: hoy-can-to-ba-jo-la-lu-na.','Cuenta: 8 sílabas.','Es un verso octosílabo.']},
  {t:'Reconocer la rima consonante',pasos:['Palabras finales: «luna» y «cuna».','Desde la última vocal acentuada coinciden: -una y -una.','Coinciden vocales y consonantes: rima consonante.']},
  {t:'Reconocer la rima asonante',pasos:['Palabras finales: «casa» y «plata».','Desde la vocal acentuada: -asa y -ata.','Solo coinciden las vocales a–a: rima asonante.']}],
 clasif:{titulo:'Laboratorio: ¿rima consonante o asonante?',ayuda:'Clasifica cada pareja de palabras.',cats:['Rima consonante','Rima asonante'],items:[
  {t:'luna – cuna',cat:'Rima consonante',why:'Coinciden vocales y consonantes: -una.'},
  {t:'casa – plata',cat:'Rima asonante',why:'Solo coinciden las vocales a–a.'},
  {t:'canción – corazón',cat:'Rima consonante',why:'Coinciden vocales y consonantes: -ón.'},
  {t:'sol – flor',cat:'Rima asonante',why:'Solo coincide la vocal o.'},
  {t:'cantar – mar',cat:'Rima consonante',why:'Coinciden vocales y consonantes: -ar.'},
  {t:'tierra – hierba',cat:'Rima asonante',why:'Coinciden las vocales e–a, pero no las consonantes.'}]},
 cards:[
  C('Contar sílabas','Se separan las sílabas y se cuenta cada una.','hoy-can-to-ba-jo-la-lu-na: 8 sílabas.',inp('Cuenta las sílabas del verso «Hoy canto bajo la luna».',['8'],'Hoy-can-to-ba-jo-la-lu-na: 8 sílabas.','Separa cada palabra en sílabas y suma.')),
  C('Rima consonante','En la rima consonante coinciden vocales y consonantes desde la última vocal acentuada.','luna – cuna.',mcq('¿Qué tipo de rima forman «luna» y «cuna»?',['Consonante','Asonante','No riman','Es un verso libre'],0,'Coinciden vocales y consonantes: -una.','Compara todos los sonidos desde la vocal acentuada.')),
  C('Estrofa','Un grupo de versos forma una estrofa.','Un poema suele tener varias estrofas.',mcq('Un grupo de versos se llama…',['Estrofa','Párrafo','Capítulo','Acto'],0,'Las estrofas agrupan versos.','Es el equivalente poético del párrafo.'))]}),
L3({id:'lyl-drama',subject:'lyl',title:'Texto dramático: diálogos y acotaciones',skill:'Distinguir acotaciones de diálogos y preparar una escena',diff:1,min:9,
 teoria:['Un texto dramático está escrito para representarse. Se compone de diálogos (lo que dicen los personajes, precedido por su nombre) y acotaciones (indicaciones del autor sobre gestos, movimientos, luces o ambiente, que suelen escribirse entre paréntesis).','La obra se divide en actos, y estos en cuadros o escenas. Un conflicto entre personajes mueve la acción hacia un desenlace.','En la exposición oral se aplican ideas parecidas: voz clara, buen ritmo, mirada al público y apoyo en gestos, siempre con una estructura de inicio, desarrollo y cierre.'],
 historia:'El teatro occidental nació en la antigua Grecia. En el siglo V a. C., en Atenas, Esquilo, Sófocles y Eurípides escribieron tragedias que se representaban en el Teatro de Dioniso. Sófocles es autor de «Edipo rey».',
 personajes:[{n:'Sófocles',d:'Dramaturgo griego (c. 496–406 a. C.), autor de «Edipo rey» y «Antígona».'}],
 ejemplos:[{t:'Leer un fragmento',pasos:['Texto: «(Entra Ana, nerviosa.) ANA: ¿Dónde dejaste la llave?».','Lo que va entre paréntesis y describe una acción es una acotación.','Lo que dice Ana, con su nombre delante, es un diálogo.']},
  {t:'Escribir una escena breve',pasos:['Elige dos personajes y un conflicto, por ejemplo perder una llave.','Escribe los diálogos con el nombre del personaje.','Añade acotaciones para indicar gestos y movimientos.','Lee la escena en voz alta para revisar el ritmo.']},
  {t:'Preparar una exposición oral',pasos:['Define el tema y el objetivo.','Organiza: inicio (presentación), desarrollo (ideas clave) y cierre (conclusión).','Practica con voz clara, buen ritmo y mirada al público.']}],
 clasif:{titulo:'Laboratorio: ¿acotación o diálogo?',ayuda:'Clasifica cada línea de un guion.',cats:['Acotación','Diálogo'],items:[
  {t:'(Entra Ana corriendo, nerviosa.)',cat:'Acotación',why:'Describe una acción y va entre paréntesis.'},
  {t:'ANA: ¿Dónde dejaste la llave?',cat:'Diálogo',why:'Lo dice un personaje, precedido por su nombre.'},
  {t:'(Se apagan las luces.)',cat:'Acotación',why:'Indica un efecto de escena.'},
  {t:'LUIS: No te preocupes, la encontraré.',cat:'Diálogo',why:'Es lo que dice Luis.'},
  {t:'(Pausa. Luis mira por la ventana.)',cat:'Acotación',why:'Indica pausa y movimiento.'},
  {t:'ANA: Tenemos poco tiempo.',cat:'Diálogo',why:'Es una intervención de Ana.'}]},
 cards:[
  C('Acotaciones','Las acotaciones indican gestos, movimientos y ambiente.','(Entra Ana, nerviosa.)',mcq('¿Qué es una acotación?',['Una indicación del autor sobre gestos, movimientos o ambiente','Lo que dice un personaje','El título de la obra','El final del acto'],0,'Orienta la puesta en escena y no se dice en voz alta.','Piensa en lo que el autor quiere que se vea.')),
  C('Partes de la obra','Una obra se divide en actos y estos en escenas.','Un acto puede tener varias escenas.',mcq('Las partes en las que se divide una obra teatral son…',['actos y escenas','capítulos y párrafos','versos y estrofas','titulares y noticias'],0,'Los actos se dividen en escenas o cuadros.','Piensa en cómo se organiza una obra en el teatro.')),
  C('Marcas del guion','Las acotaciones suelen ir entre paréntesis.','(Se apagan las luces.)',mcq('En un guion, ¿cómo suelen indicarse las acotaciones?',['Entre paréntesis','Con mayúsculas en todo el texto','Sin ninguna marca','Al final del libro'],0,'Los paréntesis las separan de los diálogos.','Fíjate en el signo que encierra la indicación.'))]}),
L3({id:'ing-sp',subject:'ing',title:'Simple present: rutinas y hábitos',skill:'Formar oraciones afirmativas, negativas y preguntas en simple present',diff:1,min:9,
 teoria:['El simple present se usa para hábitos, rutinas y hechos: I study every day. Con he, she e it el verbo lleva -s o -es: she plays, he goes.','Para negar y preguntar usamos do / does: I do not (don\'t) play; she does not (doesn\'t) play; Do you play? Does she play? Con does, el verbo principal vuelve a su forma base.','Los adverbios de frecuencia (always, usually, often, sometimes, never) se colocan antes del verbo principal: I usually walk to school.'],
 historia:'El inglés antiguo tenía muchas terminaciones verbales. Con los siglos casi todas desaparecieron, y la -s de la tercera persona del singular es uno de los pocos restos que quedan en el presente.',
 formulas:['I / you / we / they + verbo','he / she / it + verbo + s/es','Negativa: do not / does not + verbo base','Pregunta: Do / Does + sujeto + verbo base?'],
 ejemplos:[{t:'Oración afirmativa',pasos:['El sujeto es she, así que el verbo lleva -s.','play → plays.','She plays soccer every day.']},
  {t:'Oración negativa',pasos:['Quieres negar «He goes to school at seven».','Con he usa does not y el verbo vuelve a la forma base: go.','He does not go to school at seven.']},
  {t:'Pregunta',pasos:['Quieres preguntar «You watch TV at night».','Añade Do al inicio: Do you watch TV at night?','Respuesta corta: Yes, I do. / No, I don\'t.']}],
 clasif:{titulo:'Laboratorio: ¿oración correcta o incorrecta?',ayuda:'Clasifica cada oración en simple present.',cats:['Correcta','Incorrecta'],items:[
  {t:'She plays soccer every day.',cat:'Correcta',why:'Con she, el verbo lleva -s.'},
  {t:'He go to school at seven.',cat:'Incorrecta',why:'Con he debe ser goes.'},
  {t:'They watches TV at night.',cat:'Incorrecta',why:'Con they el verbo no lleva -s: watch.'},
  {t:'My brother likes music.',cat:'Correcta',why:'«My brother» equivale a he: likes.'},
  {t:'We doesn\'t like homework.',cat:'Incorrecta',why:'Con we se usa don\'t.'},
  {t:'Does she play the guitar?',cat:'Correcta',why:'Pregunta con does y el verbo en forma base.'}]},
 cards:[
  C('La -s de he, she, it','Con he, she e it el verbo lleva -s o -es.','She goes to school.',mcq('She ___ to school by bus.',['go','goes','going','gone'],1,'Con she, el verbo lleva -es: goes.','Fíjate en el sujeto.')),
  C('Negación','Con he, she e it se usa doesn\'t y el verbo queda en forma base.','He doesn\'t like pizza.',mcq('He ___ like pizza.',['doesn\'t','don\'t','isn\'t','aren\'t'],0,'Con he usamos doesn\'t + verbo base.','Piensa en do y does.')),
  C('Adverbios de frecuencia','Los adverbios de frecuencia van antes del verbo principal.','I usually walk to school.',mcq('Elige la oración correcta.',['I usually walk to school.','I walk usually to school.','Usually walk I to school.','I walk to usually school.'],0,'El adverbio va antes del verbo principal.','Colócalo antes de walk.'))]}),
L3({id:'ing-prep',subject:'ing',title:'Prepositions of place',skill:'Describir dónde están las cosas con in, on, under y next to',diff:1,min:8,
 teoria:['Las preposiciones de lugar indican dónde está algo. In significa dentro de; on, sobre una superficie; under, debajo de; next to, al lado de; between, entre dos cosas; in front of, delante de; behind, detrás de.','Se usan después del verbo to be: The book is on the table. Para preguntar por el lugar se usa where: Where is the pencil? It is in my bag.','También sirven para describir la escuela y la comunidad: The library is next to the cafeteria. The park is in front of the church.'],
 historia:'Las preposiciones son palabras pequeñas, pero muy frecuentes: in y on aparecen entre las palabras más usadas del inglés escrito. Muchas vienen del inglés antiguo y se han mantenido casi iguales durante siglos.',
 formulas:['in = dentro de','on = sobre una superficie','under = debajo de','next to = al lado de','Estructura: sujeto + is/are + preposición + lugar'],
 ejemplos:[{t:'Sobre una superficie',pasos:['Un lápiz está sobre el escritorio.','Sobre una superficie se dice on.','The pencil is on the desk.']},
  {t:'Dentro de algo',pasos:['Un gato está dentro de una caja.','Dentro de se dice in.','The cat is in the box.']},
  {t:'Describir la escuela',pasos:['La biblioteca está al lado de la cafetería.','Al lado de se dice next to.','The library is next to the cafeteria.']}],
 clasif:{titulo:'Laboratorio: elige la preposición',ayuda:'Elige la preposición que completa cada oración.',cats:['in','on','under','next to'],items:[
  {t:'The cat is ___ the box (dentro de la caja).',cat:'in',why:'Dentro de = in.'},
  {t:'The book is ___ the table (sobre la mesa).',cat:'on',why:'Sobre una superficie = on.'},
  {t:'The ball is ___ the chair (debajo de la silla).',cat:'under',why:'Debajo de = under.'},
  {t:'The school is ___ the park (al lado del parque).',cat:'next to',why:'Al lado de = next to.'},
  {t:'The notebook is ___ my bag (dentro de mi mochila).',cat:'in',why:'Dentro de = in.'},
  {t:'The picture is ___ the wall (colgado en la pared).',cat:'on',why:'En una superficie vertical también usamos on.'}]},
 cards:[
  C('Under','Under significa debajo de.','The ball is under the table.',mcq('The ball is ___ the table (debajo).',['under','on','in','next to'],0,'Debajo de = under.','Piensa en «bajo».')),
  C('In','In significa dentro de.','The pencil is in my bag.',mcq('The pencil is ___ my bag (dentro).',['in','on','under','between'],0,'Dentro de = in.','Piensa en «dentro».')),
  C('Next to','Next to significa al lado de.','The library is next to the cafeteria.',inp('Completa: The library is ___ to the cafeteria (al lado).',['next'],'La expresión es next to.','La palabra empieza con n.'))]}),
L3({id:'ing-pc',subject:'ing',title:'Present continuous',skill:'Hablar de acciones que ocurren ahora',diff:1,min:9,
 teoria:['El present continuous describe acciones que ocurren ahora o en este período: I am reading now. Se forma con am / is / are + verbo en -ing.','Afirmación: She is cooking. Negación: She is not cooking. Pregunta: Is she cooking? Se usa con palabras como now, right now, at the moment y today.','No se usa para rutinas: para hábitos usamos simple present (She cooks every day). Comparar ambos tiempos ayuda a elegir el correcto.'],
 historia:'Muchos idiomas distinguen entre lo que ocurre ahora y lo que se hace por costumbre. El inglés lo hace con el present continuous (ahora) y el simple present (rutina), una diferencia que el español expresa, por ejemplo, con «estoy leyendo» y «leo».',
 formulas:['am / is / are + verbo + ing','Negativa: am / is / are + not + verbo + ing','Pregunta: Am / Is / Are + sujeto + verbo + ing?','Marcas: now, right now, at the moment, today'],
 ejemplos:[{t:'Afirmación',pasos:['Quieres decir que Ana cocina en este momento.','Sujeto she: usa is. Verbo cook + ing.','She is cooking right now.']},
  {t:'Negación',pasos:['Quieres decir que ellos no juegan ahora.','They are not playing now.','Forma corta: They aren\'t playing.']},
  {t:'Elegir el tiempo',pasos:['«Every day» indica rutina: simple present.','«Right now» indica acción en curso: present continuous.','She walks to school every day; she is walking to school right now.']}],
 clasif:{titulo:'Laboratorio: ¿ahora o rutina?',ayuda:'Clasifica cada oración.',cats:['Present continuous','Simple present'],items:[
  {t:'She is cooking right now.',cat:'Present continuous',why:'Acción en curso: is + verbo en -ing.'},
  {t:'She cooks every day.',cat:'Simple present',why:'Rutina: every day.'},
  {t:'They are playing outside.',cat:'Present continuous',why:'Acción en curso: are + playing.'},
  {t:'We study on Mondays.',cat:'Simple present',why:'Hábito semanal.'},
  {t:'He is wearing a red shirt today.',cat:'Present continuous',why:'Situación de hoy: is wearing.'},
  {t:'I walk to school.',cat:'Simple present',why:'Rutina, sin marca de «ahora».'}]},
 cards:[
  C('Forma','Se forma con am / is / are + verbo en -ing.','They are playing soccer.',mcq('They ___ soccer right now.',['are playing','play','plays','is playing'],0,'Con they usamos are + playing.','Busca am/is/are + -ing.')),
  C('Rutina','Para rutinas usamos simple present.','She walks to school every day.',mcq('She ___ to school every day.',['walks','is walking','are walking','walking'],0,'«Every day» indica rutina: simple present.','Fíjate en «every day».')),
  C('Oración correcta','El verbo to be es obligatorio en el present continuous.','He is wearing a red shirt today.',mcq('Elige la oración correcta.',['He is wearing a red shirt today.','He wearing a red shirt today.','He are wearing a red shirt today.','He wears a red shirt now.'],0,'Con he usamos is + wearing.','No olvides el verbo to be.'))]}),
L3({id:'cyv-simbolos',subject:'cyv',title:'Símbolos patrios de El Salvador',skill:'Reconocer y describir los símbolos patrios',diff:1,min:8,
 teoria:['Los símbolos patrios representan la identidad de un país. En El Salvador son la bandera, el escudo y el Himno Nacional.','La bandera tiene tres franjas horizontales: azul, blanca y azul, con el escudo en el centro. El escudo incluye un triángulo con cinco volcanes, un arco iris, un gorro frigio y la fecha 15 de septiembre de 1821; su lema es «Dios, Unión, Libertad». El Himno Nacional tiene letra de Juan José Cañas y música de Juan Aberle.','Conocer y respetar los símbolos patrios fortalece el sentido de pertenencia y recuerda hechos importantes, como la independencia de Centroamérica en 1821.'],
 historia:'La independencia de Centroamérica se proclamó el 15 de septiembre de 1821, fecha que aparece en el escudo. El Himno Nacional, con letra de Juan José Cañas y música de Juan Aberle, fue declarado oficial en 1953.',
 personajes:[{n:'Juan José Cañas',d:'Poeta salvadoreño (1826–1918), autor de la letra del Himno Nacional.'}],
 ejemplos:[{t:'Describir la bandera',pasos:['Observa las franjas: azul arriba, blanca al centro y azul abajo.','En el centro de la franja blanca está el escudo.','Descripción: bandera de tres franjas horizontales (azul, blanca y azul) con el escudo en el centro.']},
  {t:'Leer el escudo',pasos:['Busca el triángulo: contiene cinco volcanes, un arco iris y un gorro frigio.','Lee la fecha: 15 de septiembre de 1821.','El lema es «Dios, Unión, Libertad».']},
  {t:'Identificar a los autores del himno',pasos:['El Himno Nacional es una obra con letra y música.','La letra es de Juan José Cañas.','La música es de Juan Aberle.']}],
 clasif:{titulo:'Laboratorio: ¿a qué símbolo corresponde?',ayuda:'Clasifica cada característica.',cats:['Bandera','Escudo','Himno Nacional'],items:[
  {t:'Tres franjas horizontales: azul, blanca y azul',cat:'Bandera',why:'Describe los colores y la disposición de la bandera.'},
  {t:'Triángulo con cinco volcanes y un arco iris',cat:'Escudo',why:'Son elementos del escudo.'},
  {t:'Letra de Juan José Cañas',cat:'Himno Nacional',why:'Cañas escribió la letra del himno.'},
  {t:'Lema «Dios, Unión, Libertad»',cat:'Escudo',why:'El lema aparece en el escudo.'},
  {t:'Música de Juan Aberle',cat:'Himno Nacional',why:'Aberle compuso la música del himno.'},
  {t:'Se iza en actos cívicos y se coloca en las escuelas',cat:'Bandera',why:'Es el símbolo que se iza.'}]},
 cards:[
  C('Fecha del escudo','El escudo incluye la fecha de la independencia.','15 de septiembre de 1821.',mcq('¿Qué fecha aparece en el escudo de El Salvador?',['15 de septiembre de 1821','1 de enero de 1900','16 de enero de 1992','12 de agosto de 1953'],0,'Es la fecha de la independencia de Centroamérica.','Piensa en la independencia.')),
  C('Colores de la bandera','La bandera tiene franjas azul, blanca y azul.','El escudo va en el centro.',mcq('Los colores de la bandera de El Salvador son…',['azul y blanco','rojo y amarillo','verde y blanco','azul y rojo'],0,'Las franjas son azul, blanca y azul.','Recuerda las franjas.')),
  C('Autor de la letra','La letra del Himno Nacional es de Juan José Cañas.','La música es de Juan Aberle.',mcq('¿Quién escribió la letra del Himno Nacional?',['Juan José Cañas','Salarrué','Rubén Darío','Francisco Gavidia'],0,'La letra es de Juan José Cañas.','Recuerda al poeta mencionado en la teoría.'))]}),
L3({id:'cyv-democracia',subject:'cyv',title:'Democracia y participación ciudadana',skill:'Reconocer formas de participación democrática',diff:1,min:9,

(function(){
 // FIX-004: clonar en profundidad para no compartir arrays entre temas
 const clone=(id,nid,sub)=>{
  const s=LESSONS.find(t=>t.id===id);
  if(!s){console.warn('[Metax] clone: tema origen no existe:',id);return}
  const deep=JSON.parse(JSON.stringify(s));
  deep.id=nid;
  deep.subject=sub;
  deep.fuente_oficial_url=SUBJECTS[sub].url;
  LESSONS.push(deep);
 };
 clone('fis-newton','cfi-newton','cfi');clone('fis-arq','cfi-arq','cfi');clone('bio-gen','cyt-gen','cyt');clone('bio-eco','cyt-eco','cyt');
 LESSONS.forEach(t=>{
  t.guiaTutor=GUIA_TUTOR[t.id];
  const p=PLACE[t.id],u=p&&(PLAN[p[0]]&&PLAN[p[0]][p[1]]||[])[p[2]-1];
  if(!u){t.grados=[];return}
  t.grados=[p[0]];t.ciclos=[cicloOf(p[0])];t.subject=p[1];t.unit=u.u;
